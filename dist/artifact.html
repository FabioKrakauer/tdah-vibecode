<title>Seu mundo, seu ritmo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Site interativo de psicoeducação sobre TDAH para adolescentes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;1,6..12,400&family=Caveat:wght@500;600&display=swap">
<style>
/* Layout: barra lateral fixa (navegação) + palco central com conteúdo; no celular a barra vira gaveta. */
:root{
  --roxo:#7656A8; --roxo-700:#5C4290; --roxo-900:#3B2860;
  --lilas:#C6B2E8; --lilas-200:#E2D7F4; --lilas-100:#F0EAFA; --lilas-50:#F8F5FD;
  --agua:#91D8C9; --agua-600:#5BBBA7; --agua-800:#1F6B5C; --agua-100:#E0F5F0;
  --amarelo:#F2D47E; --amarelo-100:#FBF2D6; --amarelo-800:#8A6A12;
  --coral:#E9A4AD; --coral-100:#FBE8EB; --coral-800:#A2404D;
  --azul:#A9C9E9; --azul-100:#E7F0FA; --azul-800:#2F5F8F;
  --bg:#FBF9FE; --surface:#FFFFFF; --ink:#271F3B; --muted:#655C7A; --line:#E6DFF2;
  --shadow:0 1px 2px rgba(59,40,96,.06),0 10px 28px -14px rgba(59,40,96,.22);
  --shadow-lg:0 2px 4px rgba(59,40,96,.06),0 24px 48px -20px rgba(59,40,96,.30);
  --r-xl:28px; --r-lg:22px; --r-md:16px; --r-sm:12px;
  --f-display:"Outfit","Segoe UI",system-ui,sans-serif;
  --f-body:"Nunito Sans","Segoe UI",system-ui,sans-serif;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);color:var(--roxo-900);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(1.9rem,1.4rem + 2vw,2.7rem);font-weight:600;letter-spacing:-.01em}
h2{font-size:clamp(1.4rem,1.2rem + .9vw,1.8rem);font-weight:600}
h3{font-size:1.2rem;font-weight:600}
h4{font-size:1.02rem;font-weight:600}
p{margin:0}
a{color:var(--roxo-700)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:3px solid var(--roxo);outline-offset:2px;border-radius:8px}
input,textarea,select{font:inherit;color:var(--ink)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-lg{display:flex;flex-direction:column;gap:36px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.prose{max-width:68ch}
.prose p + p{margin-top:.8em}
ul.clean{list-style:none;padding:0;margin:0}
.ticks{padding-left:0;list-style:none;margin:0;display:flex;flex-direction:column;gap:8px}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:4px;top:.55em;width:10px;height:10px;border-radius:3px;background:var(--agua);transform:rotate(45deg)}

/* ---------- Estrutura ---------- */
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 16px 18px}
.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 18px;text-decoration:none;color:inherit}
.brand-mark{width:44px;height:44px;flex:none;border-radius:14px;background:linear-gradient(140deg,var(--roxo),#9A7BCB);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px -8px var(--roxo)}
.brand-title{font-family:var(--f-display);font-weight:600;font-size:1.06rem;line-height:1.2;color:var(--roxo-900)}
.brand-sub{font-size:.78rem;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-label{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:14px 10px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:12px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.95rem;transition:background .2s}
.nav a:hover{background:var(--lilas-50)}
.nav a.active{background:var(--lilas-100);color:var(--roxo-900)}
.nav a .ni{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--lilas-50);color:var(--roxo);flex:none}
.nav a.active .ni{background:var(--roxo);color:#fff}
.nav a .nstate{margin-left:auto;color:var(--lilas);display:grid}
.nav a .nstate.done{color:var(--amarelo)}
.nav a .nnum{font-size:.72rem;color:var(--muted);font-weight:700}
.side-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.side-foot a,.side-foot button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--muted);font-size:.86rem;font-weight:600;background:none;border:0;text-align:left;width:100%}
.side-foot a:hover,.side-foot button:hover{background:var(--lilas-50);color:var(--roxo-900)}
.side-foot a.active{color:var(--roxo-900);background:var(--lilas-100)}
.mini-progress{margin:6px 8px 4px;padding:12px;border-radius:14px;background:var(--lilas-50);border:1px solid var(--line)}
.mini-progress .bar{height:8px;border-radius:99px;background:var(--lilas-200);overflow:hidden;margin-top:8px}
.mini-progress .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--agua-600),var(--agua));border-radius:99px;transition:width .6s ease}
.mini-progress .stars{display:flex;gap:4px;margin-top:8px;color:var(--lilas-200)}
.mini-progress .stars .on{color:var(--amarelo)}

.topbar{display:none}
.scrim{display:none}
main{min-width:0;padding-block:36px 96px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.view{max-width:1060px;margin:0 auto;animation:viewIn .45s ease both}
@keyframes viewIn{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (max-width:920px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;inset:0 auto 0 0;width:min(310px,86vw);z-index:60;transform:translateX(-102%);transition:transform .3s ease;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(39,31,59,.35);z-index:55;opacity:0;pointer-events:none;transition:opacity .3s}
  .scrim.open{opacity:1;pointer-events:auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--surface)}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar .brand-title{font-size:1rem}
  .topbar .tb-prog{margin-left:auto;display:flex;gap:3px;color:var(--lilas-200)}
  .topbar .tb-prog .on{color:var(--amarelo)}
  main{padding-block:22px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}

/* ---------- Componentes ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:.97rem;text-decoration:none;transition:transform .15s ease,box-shadow .2s,background .2s;line-height:1.2}
.btn:active{transform:translateY(1px) scale(.98)}
.btn-primary{background:var(--agua);color:#123F37;box-shadow:0 8px 18px -10px var(--agua-800)}
.btn-primary:hover{background:#7FD0BF}
.btn-roxo{background:var(--roxo);color:#fff;box-shadow:0 8px 18px -10px var(--roxo-900)}
.btn-roxo:hover{background:var(--roxo-700)}
.btn-ghost{background:var(--surface);color:var(--roxo-900);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--lilas);background:var(--lilas-50)}
.btn-soft{background:var(--lilas-100);color:var(--roxo-900)}
.btn-soft:hover{background:var(--lilas-200)}
.btn-sm{padding:8px 14px;font-size:.88rem}
.btn-icon{width:40px;height:40px;padding:0;border-radius:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.9rem;color:var(--ink);transition:all .2s}
.chip:hover{border-color:var(--lilas)}
.chip.on{background:var(--roxo);border-color:var(--roxo);color:#fff}
.chip.agua.on{background:var(--agua);border-color:var(--agua);color:#123F37}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.76rem;font-weight:700;letter-spacing:.02em;background:var(--lilas-100);color:var(--roxo-700)}
.tag.agua{background:var(--agua-100);color:var(--agua-800)}
.tag.coral{background:var(--coral-100);color:var(--coral-800)}
.tag.amarelo{background:var(--amarelo-100);color:var(--amarelo-800)}
.tag.azul{background:var(--azul-100);color:var(--azul-800)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card.lav{background:var(--lilas-50)}
.panel{border-radius:var(--r-lg);padding:22px;background:var(--lilas-50);border:1px solid var(--line)}
.note{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r-md);padding:14px 16px;background:var(--azul-100);color:#22405F;font-size:.94rem}
.note.lav{background:var(--lilas-100);color:var(--roxo-900)}
.note.agua{background:var(--agua-100);color:#16483F}
.note.amarelo{background:var(--amarelo-100);color:#5C4708}
.note svg{flex:none;margin-top:2px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--roxo)}
.hand{font-family:var(--f-hand);font-size:1.45rem;line-height:1.1;color:var(--roxo)}
.reflect{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:var(--r-md);background:linear-gradient(135deg,var(--amarelo-100),#FFF8E6);border:1px dashed #E7C766}
.reflect .rq{font-weight:700;color:#4A3A0A}
.reflect .rl{font-size:.74rem;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--amarelo-800);margin-bottom:2px}
.icon-blob{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none}
.b-lilas{background:var(--lilas-100);color:var(--roxo)}
.b-agua{background:var(--agua-100);color:var(--agua-800)}
.b-coral{background:var(--coral-100);color:var(--coral-800)}
.b-amarelo{background:var(--amarelo-100);color:var(--amarelo-800)}
.b-azul{background:var(--azul-100);color:var(--azul-800)}
.divider{height:1px;background:var(--line);border:0;margin:0}

/* Cabeçalho de seção */
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;margin-bottom:28px}
.sec-head .lead{font-size:1.08rem;color:var(--muted);max-width:62ch;margin-top:10px}
.sec-head .stage-badge{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.85rem;font-weight:700;color:var(--muted)}
.sec-head .stage-badge.done{color:var(--amarelo-800);background:var(--amarelo-100);border-color:#EBD38C}
@media (max-width:700px){.sec-head{grid-template-columns:1fr}.sec-head .stage-badge{justify-self:start}}
.sec-title{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sec-title .ln{flex:1;height:1px;background:var(--line)}

/* Rodapé de etapa */
.stage-foot{margin-top:44px;border-radius:var(--r-xl);padding:26px;background:linear-gradient(120deg,var(--lilas-100),var(--agua-100));display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.stage-foot h3{margin-bottom:4px}

/* ---------- Início ---------- */
.hero{position:relative;border-radius:var(--r-xl);overflow:hidden;background:radial-gradient(120% 90% at 80% 0%,#EDE3FB 0%,var(--lilas-50) 45%,#F4FBF9 100%);border:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);align-items:center}
.hero-text{padding:46px 10px 46px 44px;position:relative;z-index:2}
.hero-title-slot{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:var(--surface);border:1.5px dashed var(--lilas);font-family:var(--f-display);font-weight:600;color:var(--roxo-700);font-size:.95rem;margin-bottom:22px}
.hero h1{font-size:clamp(2.1rem,1.4rem + 3vw,3.3rem);font-weight:700;line-height:1.05;color:var(--roxo-900)}
.hero h1 .accent{color:var(--roxo);display:block}
.hero p.sub{font-size:1.12rem;color:var(--muted);margin-top:18px;max-width:44ch}
.hero .cta{margin-top:28px;display:flex;flex-wrap:wrap;gap:12px}
.hero-art{position:relative;min-height:360px;height:100%}
.hero-art svg{position:absolute;inset:0;width:100%;height:100%}
@media (max-width:820px){.hero{grid-template-columns:1fr}.hero-text{padding:30px 22px 8px}.hero-art{min-height:260px}}
.e-in{animation:eIn .7s cubic-bezier(.2,.8,.2,1) both}
.e-in.d1{animation-delay:.08s}.e-in.d2{animation-delay:.16s}.e-in.d3{animation-delay:.24s}.e-in.d4{animation-delay:.32s}
@keyframes eIn{from{opacity:.0;transform:translateY(14px)}to{opacity:1;transform:none}}
.twinkle{animation:tw 3.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.twinkle.t2{animation-delay:1.1s}.twinkle.t3{animation-delay:2s}
@keyframes tw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
.floaty{animation:fl 6s ease-in-out infinite;transform-box:fill-box}
.floaty.f2{animation-delay:-2s;animation-duration:7s}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.beam{animation:beam 7s ease-in-out infinite;transform-origin:50% 0;transform-box:fill-box}
.beam.b2{animation-delay:-3.5s}
@keyframes beam{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.roll{animation:roll 4s ease-in-out infinite;transform-box:fill-box}
@keyframes roll{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}

/* Pista de progresso (patins) */
.track{position:relative;border-radius:var(--r-xl);background:var(--surface);border:1px solid var(--line);padding:22px 22px 18px;box-shadow:var(--shadow)}
.track-svg{width:100%;height:auto;display:block;overflow:visible}
.track-legend{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:6px}
.track-legend a{text-decoration:none;color:var(--muted);font-size:.8rem;font-weight:700;text-align:center;line-height:1.25;padding:6px 4px;border-radius:10px}
.track-legend a:hover{background:var(--lilas-50);color:var(--roxo-900)}
.track-legend a.done{color:var(--roxo-900)}
.track-legend a small{display:block;font-weight:600;color:var(--muted);font-size:.72rem}
@media (max-width:640px){.track-legend{grid-template-columns:repeat(3,minmax(0,1fr))}}
.track .skater{transition:transform 1s cubic-bezier(.4,1.4,.5,1)}

.steps-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.step-card{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;transition:transform .2s,box-shadow .2s,border-color .2s}
.step-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--lilas)}
.step-card .sn{font-family:var(--f-display);font-weight:700;color:var(--lilas);font-size:.9rem}
.step-card .st{display:flex;justify-content:space-between;align-items:center}
.step-card p{font-size:.92rem;color:var(--muted)}
.step-card .badge-line{font-size:.8rem;font-weight:700;color:var(--muted);display:flex;gap:6px;align-items:center}
.step-card.done .badge-line{color:var(--amarelo-800)}

/* ---------- Cérebro ---------- */
.brain-wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:20px;align-items:stretch}
@media (max-width:860px){.brain-wrap{grid-template-columns:1fr}}
.brain-stage{position:relative;border-radius:var(--r-xl);background:radial-gradient(90% 80% at 50% 30%,#FFFFFF,var(--lilas-50));border:1px solid var(--line);padding:14px}
.brain-svg{width:100%;height:auto;display:block}
.brain-svg .lobe{cursor:pointer;stroke:#fff;stroke-width:3;transition:filter .25s,opacity .25s,transform .25s;transform-box:fill-box;transform-origin:center}
.brain-svg .lobe:hover,.brain-svg .lobe:focus{filter:brightness(1.04) saturate(1.2);outline:none}
.brain-svg .lobe.sel{filter:drop-shadow(0 6px 10px rgba(59,40,96,.28)) saturate(1.25)}
.brain-svg.has-sel .lobe:not(.sel){opacity:.55}
.brain-svg .deep{cursor:pointer}
.brain-svg .deep circle.core{transition:r .2s}
.brain-svg .deep:hover circle.core,.brain-svg .deep.sel circle.core{r:11}
.brain-svg .pulse{animation:pulse 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
.brain-svg text{font-family:var(--f-display);font-size:11px;font-weight:600;fill:var(--roxo-900);pointer-events:none}
.brain-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.region-panel{display:flex;flex-direction:column;gap:14px}
.region-panel .rp-fn{display:flex;flex-wrap:wrap;gap:6px}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;counter-reset:f}
.flow button{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;color:var(--roxo-900);font-size:.92rem;transition:all .2s;position:relative}
.flow button .fi{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--lilas-100);color:var(--roxo)}
.flow button.on{border-color:var(--roxo);background:var(--lilas-50)}
.flow button.on .fi{background:var(--roxo);color:#fff}
.flow button small{font-weight:600;color:var(--muted);font-size:.74rem}
@media (max-width:700px){.flow{grid-template-columns:repeat(3,minmax(0,1fr))}}
.flow-detail{margin-top:14px}
.concepts{display:flex;flex-wrap:wrap;gap:8px}
.ef-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.ef-card{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:12px;transition:transform .2s,box-shadow .2s;box-shadow:var(--shadow);position:relative}
.ef-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.ef-card .ef-nick{font-family:var(--f-hand);font-size:1.35rem;color:var(--roxo);line-height:1}
.ef-card .seen{position:absolute;top:16px;right:16px;color:var(--amarelo)}
.ef-card .open-hint{margin-top:auto;font-size:.85rem;font-weight:700;color:var(--agua-800);display:flex;align-items:center;gap:6px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(39,31,59,.42);z-index:80;display:grid;place-items:center;padding:20px;animation:fade .25s ease both;overflow-y:auto}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:var(--r-xl);max-width:640px;width:100%;max-height:calc(100vh - 40px);overflow-y:auto;box-shadow:var(--shadow-lg);animation:pop .35s cubic-bezier(.2,1.2,.4,1) both;position:relative}
.modal.wide{max-width:780px}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{padding:26px 26px 0;display:flex;gap:14px;align-items:flex-start}
.modal-body{padding:18px 26px 26px;display:flex;flex-direction:column;gap:16px}
.modal-close{position:absolute;top:14px;right:14px;background:var(--lilas-50);border:0;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--roxo-900)}
.modal-close:hover{background:var(--lilas-100)}
.kv{display:grid;gap:4px}
.kv .k{font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--roxo)}

/* ---------- TDAH ---------- */
.chapters{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.chapter-nav{display:flex;flex-direction:column;gap:6px;position:sticky;top:20px}
.chapter-nav button{display:flex;gap:10px;align-items:center;text-align:left;border:1.5px solid transparent;background:none;border-radius:12px;padding:10px 12px;font-weight:700;color:var(--muted);font-size:.92rem}
.chapter-nav button .cn{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--lilas-100);color:var(--roxo);font-size:.8rem;flex:none}
.chapter-nav button.on{background:var(--surface);border-color:var(--line);color:var(--roxo-900);box-shadow:var(--shadow)}
.chapter-nav button.on .cn{background:var(--roxo);color:#fff}
.chapter-nav button.read .cn{background:var(--agua-100);color:var(--agua-800)}
.chapter-nav button.on.read .cn{background:var(--roxo);color:#fff}
@media (max-width:860px){.chapters{grid-template-columns:1fr}.chapter-nav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}.chapter-nav button{flex:none}}
.chapter{min-height:320px}
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.eq{display:flex;gap:18px;align-items:flex-end;justify-content:center;height:170px;padding:14px;border-radius:var(--r-lg);background:var(--roxo-900);position:relative;overflow:hidden}
.eq .ch{display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.eq .bars{display:flex;gap:4px;align-items:flex-end;height:110px}
.eq .bars i{display:block;width:12px;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,var(--amarelo),var(--agua));transition:height .8s cubic-bezier(.3,1.3,.5,1)}
.eq .ch span{color:#E8E0F7;font-size:.78rem;font-weight:700}

/* Quiz */
.quiz{max-width:720px;margin:0 auto}
.q-dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:18px}
.q-dots button{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:.7rem;font-weight:800;color:var(--muted);padding:0}
.q-dots button.ans{background:var(--lilas-100);border-color:var(--lilas);color:var(--roxo)}
.q-dots button.cur{background:var(--roxo);border-color:var(--roxo);color:#fff}
.q-card{background:var(--surface);border-radius:var(--r-xl);border:1px solid var(--line);box-shadow:var(--shadow-lg);padding:30px;text-align:center;position:relative;overflow:hidden}
.q-card .q-text{font-family:var(--f-display);font-size:clamp(1.25rem,1.1rem + .9vw,1.6rem);font-weight:600;color:var(--roxo-900);margin:12px auto 24px;max-width:28ch;line-height:1.3}
.q-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:440px;margin:0 auto}
.q-opt{border:2px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:16px;font-weight:800;font-size:1.05rem;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .2s}
.q-opt:hover:not(:disabled){border-color:var(--lilas);transform:translateY(-2px)}
.q-opt.mito{color:var(--coral-800)}
.q-opt.verdade{color:var(--agua-800)}
.q-opt.picked{border-color:var(--roxo);background:var(--lilas-50)}
.q-opt:disabled{opacity:1;cursor:default}
.q-feedback{text-align:left;margin-top:22px;animation:eIn .45s ease both}
.q-verdict{display:flex;gap:10px;align-items:center;font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin-bottom:8px}
.q-verdict.mito{color:var(--coral-800)}
.q-verdict.verdade{color:var(--agua-800)}
.q-nav{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}

/* Cartas */
.deck-wrap{max-width:760px;margin:0 auto}
.cat-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.deck{perspective:1400px}
.pcard{position:relative;border-radius:var(--r-xl);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lg);padding:30px;overflow:hidden;animation:dealIn .45s cubic-bezier(.2,1.1,.4,1) both}
@keyframes dealIn{from{opacity:0;transform:translateX(30px) rotate(2deg)}to{opacity:1;transform:none}}
.pcard.back{animation-name:dealBack}
@keyframes dealBack{from{opacity:0;transform:translateX(-30px) rotate(-2deg)}to{opacity:1;transform:none}}
.pcard .pc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pcard .pc-sit{font-family:var(--f-display);font-size:clamp(1.25rem,1.05rem + 1vw,1.65rem);font-weight:600;color:var(--roxo-900);margin:22px 0 8px;line-height:1.3}
.pcard .pc-deco{position:absolute;right:-30px;bottom:-30px;opacity:.5;pointer-events:none}
.resp-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:22px}
@media (max-width:640px){.resp-grid{grid-template-columns:1fr 1fr}}
.resp{border:2px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:12px 8px;font-weight:700;font-size:.9rem;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .2s;color:var(--roxo-900)}
.resp .rdot{width:14px;height:14px;border-radius:50%}
.resp:hover{border-color:var(--lilas);transform:translateY(-2px)}
.resp.picked{border-color:var(--roxo);background:var(--lilas-50)}
.follow{margin-top:18px;animation:eIn .45s ease both}
.deck-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px}
.deck-count{font-weight:700;color:var(--muted);font-size:.9rem}

/* Jogos */
.games-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.game-tile{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:10px;transition:transform .2s,box-shadow .2s,border-color .2s;box-shadow:var(--shadow)}
.game-tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.game-tile.on{border-color:var(--roxo);box-shadow:0 0 0 3px var(--lilas-200)}
.game-tile .gt-top{display:flex;justify-content:space-between;align-items:center}
.game-tile p{font-size:.88rem;color:var(--muted)}
.game-area{margin-top:22px;border-radius:var(--r-xl);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lg);padding:26px;min-height:320px}
.game-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:16px}
.game-instr{font-size:1.02rem}
.gstatus{font-weight:700;color:var(--muted);font-size:.9rem}
.att-grid{display:grid;gap:6px;margin:0 auto;max-width:520px;position:relative}
.att-cell{aspect-ratio:1;border:0;background:var(--lilas-50);border-radius:12px;display:grid;place-items:center;padding:4px;transition:transform .15s,background .2s}
.att-cell:hover{transform:scale(1.07)}
.att-cell.found{background:var(--agua-100);box-shadow:inset 0 0 0 2.5px var(--agua-600)}
.att-cell.nope{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.att-cell svg{width:78%;height:78%}
.distract-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.distract-layer span{position:absolute;animation:drift 5s linear infinite;opacity:.8}
@keyframes drift{from{transform:translate(0,30px) rotate(0)}to{transform:translate(40px,-60px) rotate(30deg);opacity:0}}
.target-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--lilas-100);font-weight:700}
.target-pill svg{width:30px;height:30px}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:340px;margin:10px auto}
.pad{aspect-ratio:1;border:0;border-radius:26px;display:grid;place-items:center;transition:transform .12s,filter .12s,box-shadow .12s;box-shadow:0 8px 0 -2px rgba(0,0,0,.08)}
.pad svg{width:46%;height:46%}
.pad.lit{transform:scale(1.06);filter:brightness(1.12) saturate(1.3);box-shadow:0 0 0 6px rgba(255,255,255,.9),0 0 30px 6px currentColor}
.pad:disabled{opacity:1;cursor:default}
.stage-box{position:relative;height:250px;border-radius:var(--r-lg);background:radial-gradient(60% 80% at 50% 0%,#4C3577,var(--roxo-900) 70%);overflow:hidden;display:grid;place-items:center;margin:10px 0 16px}
.stage-box .spot{position:absolute;top:-20px;left:50%;width:260px;height:300px;transform:translateX(-50%);background:radial-gradient(50% 60% at 50% 100%,rgba(242,212,126,.55),transparent 70%);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);opacity:0;transition:opacity .2s}
.stage-box .spot.on{opacity:1}
.stage-box .stim{position:relative;width:120px;height:120px;display:grid;place-items:center;animation:popIn .18s ease both}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.stage-box .flash{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#fff;font-weight:700;font-size:.95rem}
.stage-floor{position:absolute;bottom:0;left:0;right:0;height:38px;background:linear-gradient(180deg,#5B4386,#3B2860)}
.clap-btn{font-size:1.1rem;padding:16px 34px}
.plan-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){.plan-cols{grid-template-columns:1fr}}
.plan-list{display:flex;flex-direction:column;gap:8px;min-height:120px;padding:12px;border-radius:var(--r-md);background:var(--lilas-50);border:1.5px dashed var(--lilas)}
.plan-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:.93rem;text-align:left;width:100%}
.plan-item .pn{width:24px;height:24px;border-radius:8px;background:var(--roxo);color:#fff;display:grid;place-items:center;font-size:.78rem;font-weight:800;flex:none}
.plan-item .grow{flex:1;min-width:0}
.plan-item .mini{border:0;background:var(--lilas-50);width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;color:var(--roxo-900)}
.plan-item .mini:hover{background:var(--lilas-100)}
.plan-item.bank:hover{border-color:var(--agua-600)}
.plan-item.warn{border-color:var(--coral);background:var(--coral-100)}
.flex-table{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.bin{border:2px dashed var(--lilas);border-radius:var(--r-md);padding:12px;background:var(--lilas-50);display:flex;flex-direction:column;align-items:center;gap:8px;transition:all .2s}
.bin:hover{border-color:var(--roxo);background:var(--lilas-100)}
.bin.good{border-color:var(--agua-600);background:var(--agua-100)}
.bin.bad{border-color:var(--coral);background:var(--coral-100)}
.fcard{width:96px;height:120px;border-radius:14px;background:var(--surface);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:var(--shadow);flex-wrap:wrap;padding:6px}
.fcard svg{width:30px;height:30px}
.fcard.big{width:130px;height:160px}
.fcard.big svg{width:40px;height:40px}
.fcard.rule-cor{border:3px solid var(--amarelo);box-shadow:0 0 0 4px var(--amarelo-100)}
.fcard.rule-forma{border:3px dashed var(--roxo)}
.rule-banner{display:inline-flex;gap:8px;align-items:center;padding:8px 16px;border-radius:999px;background:var(--roxo);color:#fff;font-weight:700}
.rule-banner.changed{animation:wob .6s}
@keyframes wob{30%{transform:scale(1.1) rotate(-2deg)}60%{transform:scale(.97) rotate(1deg)}}
.game-end{display:flex;flex-direction:column;gap:16px;animation:eIn .45s ease both}

/* Ferramentas */
.sit-row{display:flex;gap:8px;flex-wrap:wrap}
.tool-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:18px}
.tool-card{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;position:relative}
.tool-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.tool-card p{font-size:.9rem;color:var(--muted)}
.tool-card .seen{position:absolute;top:14px;right:14px;color:var(--amarelo)}
.tool-steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.res-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.res-box{border-radius:var(--r-xl);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lg);padding:24px}
.add-row{display:flex;gap:8px}
.add-row input,.field{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--surface)}
.add-row input:focus,.field:focus,textarea:focus{border-color:var(--roxo);outline:none;box-shadow:0 0 0 3px var(--lilas-200)}
.todo-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.todo{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--lilas-50);border:1px solid var(--line)}
.todo label{flex:1;min-width:0;display:flex;align-items:center;gap:10px;cursor:pointer;overflow-wrap:anywhere}
.todo input[type=checkbox]{width:22px;height:22px;accent-color:var(--agua-600);flex:none}
.todo.done label span{text-decoration:line-through;color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r-md);font-size:.93rem}
.timer-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:700px){.timer-wrap{grid-template-columns:1fr;justify-items:center}}
.vinyl{width:240px;height:240px;position:relative;max-width:100%}
.vinyl svg{width:100%;height:100%}
.vinyl .disc{transform-origin:50% 50%;transform-box:view-box}
.vinyl.spin .disc{animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vinyl .time{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:2.1rem;color:var(--roxo-900);font-variant-numeric:tabular-nums}
.vinyl .time span{background:rgba(255,255,255,.92);padding:2px 12px;border-radius:12px}
.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kanban{grid-template-columns:1fr}}
.kcol{border-radius:var(--r-md);padding:12px;min-height:180px;display:flex;flex-direction:column;gap:8px}
.kcol h4{display:flex;justify-content:space-between;align-items:center}
.kcol.c0{background:var(--lilas-50);border:1px solid var(--lilas-200)}
.kcol.c1{background:var(--amarelo-100);border:1px solid #EFDDA4}
.kcol.c2{background:var(--agua-100);border:1px solid #BCE7DD}
.kitem{background:var(--surface);border-radius:12px;padding:10px;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-weight:600;font-size:.92rem;overflow-wrap:anywhere}
.kitem .kact{display:flex;gap:6px;justify-content:flex-end}
.kitem.dragging{opacity:.5}
.kcol.over{outline:2px dashed var(--roxo)}
.steps-plan .goal{font-family:var(--f-display);font-weight:600;font-size:1.2rem;color:var(--roxo-900)}
.star-meter{display:flex;gap:4px;flex-wrap:wrap;color:var(--lilas-200)}
.star-meter .on{color:var(--amarelo)}

/* Manual */
.man-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.man-q{display:flex;flex-direction:column;gap:10px}
.man-q label{font-family:var(--f-display);font-weight:600;color:var(--roxo-900);font-size:1.06rem;display:flex;gap:10px;align-items:flex-start}
.man-q label .qn{width:28px;height:28px;border-radius:9px;background:var(--lilas-100);color:var(--roxo);display:grid;place-items:center;font-size:.82rem;flex:none}
.man-q textarea{width:100%;min-height:110px;resize:vertical;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:linear-gradient(transparent 31px,var(--lilas-100) 32px) 0 6px/100% 32px,var(--surface);line-height:32px;font-size:1rem}
.man-q .sugs{display:flex;flex-wrap:wrap;gap:6px}
.man-q .sugs button{border:1px dashed var(--lilas);background:var(--lilas-50);border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:600;color:var(--roxo-700)}
.man-q .sugs button:hover{background:var(--lilas-100)}
.persona{display:flex;gap:10px;flex-wrap:wrap}
.persona button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;display:grid;place-items:center;width:64px;height:64px}
.persona button.on{border-color:var(--roxo);background:var(--lilas-50)}
.swatches{display:flex;gap:10px}
.swatches button{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.swatches button.on{box-shadow:0 0 0 3px var(--roxo)}

.doc{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);border:1px solid var(--line);overflow:hidden;max-width:860px;margin:0 auto}
.doc-head{position:relative;padding:44px 40px 36px;color:#fff;overflow:hidden}
.doc-head h1{color:#fff;font-size:clamp(1.9rem,1.5rem + 2vw,2.8rem)}
.doc-head .hand{color:#fff;opacity:.92;font-size:1.6rem}
.doc-head svg.deco{position:absolute;right:-10px;top:-10px;opacity:.9}
.doc-body{padding:30px 40px 40px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.doc-item{border-radius:var(--r-md);padding:18px;border:1px solid var(--line);background:var(--lilas-50);break-inside:avoid;page-break-inside:avoid}
.doc-item.full{grid-column:1/-1}
.doc-item h4{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.doc-item p{white-space:pre-wrap;overflow-wrap:anywhere}
.doc-item .blank{color:var(--muted);font-style:italic}
.doc-foot{padding:0 40px 30px;color:var(--muted);font-size:.85rem;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (max-width:700px){.doc-head{padding:30px 22px}.doc-body{grid-template-columns:1fr;padding:22px}.doc-foot{padding:0 22px 22px}}

/* Família / guia / referências */
.fam-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;align-items:start}
.toc{position:sticky;top:20px;display:flex;flex-direction:column;gap:2px;font-size:.88rem}
.toc button{text-align:left;border:0;background:none;color:var(--muted);padding:6px 10px;border-radius:8px;font-weight:600;font-size:.88rem}
.toc button:hover{background:var(--lilas-50);color:var(--roxo-900)}
@media (max-width:900px){.fam-layout{grid-template-columns:1fr}.toc{position:static;flex-direction:row;flex-wrap:wrap}}
.fam-sec{scroll-margin-top:80px}
.fam-sec h2{margin-bottom:12px}
.swap{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch}
.swap .from,.swap .to{border-radius:14px;padding:12px 14px;font-size:.94rem}
.swap .from{background:var(--coral-100);color:#6D2A33}
.swap .to{background:var(--agua-100);color:#16483F;font-weight:600}
.swap .arrow{display:grid;place-items:center;color:var(--roxo)}
@media (max-width:640px){.swap{grid-template-columns:1fr}.swap .arrow{transform:rotate(90deg)}}
details.acc{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);overflow:hidden}
details.acc summary{list-style:none;cursor:pointer;padding:16px 18px;font-family:var(--f-display);font-weight:600;color:var(--roxo-900);display:flex;justify-content:space-between;align-items:center;gap:10px}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary .chev{transition:transform .25s;color:var(--roxo)}
details.acc[open] summary .chev{transform:rotate(180deg)}
details.acc .acc-body{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px}
.ref-list{display:flex;flex-direction:column;gap:12px;padding-left:0;list-style:none;counter-reset:r}
.ref-list li{padding-left:40px;position:relative;font-size:.94rem;overflow-wrap:anywhere}
.ref-list li::before{counter-increment:r;content:counter(r);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:8px;background:var(--lilas-100);color:var(--roxo);display:grid;place-items:center;font-size:.78rem;font-weight:800}
.guide-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}

const TDAH_CHAPTERS = [
  { id: "oque", titulo: "O que é o TDAH",
    html: `<p>TDAH significa <strong>Transtorno do Déficit de Atenção e Hiperatividade</strong>. É um <strong>transtorno do neurodesenvolvimento</strong>: tem relação com a forma como o cérebro se desenvolve e funciona, e seus sinais aparecem desde a infância.</p>
    <p>Ele se caracteriza por um padrão de <strong>desatenção</strong> e/ou <strong>hiperatividade e impulsividade</strong> que é persistente (dura bastante tempo), aparece em mais de um lugar (em casa, na escola, com amigos) e atrapalha o dia a dia de forma importante.</p>

  { id: "atencao", titulo: "Atenção não é liga ou desliga",
    html: `<p>Um dos maiores mitos é achar que quem tem TDAH “não presta atenção em nada”. Na verdade, o TDAH envolve dificuldades na <strong>regulação</strong> da atenção: direcionar o foco para o que é necessário, manter esse foco quando a tarefa é pouco interessante e mudar de foco no momento certo.</p>
    <p>Por isso é comum conseguir se concentrar muito em algo interessante, novo ou desafiador, às vezes a ponto de perder a noção do tempo, e ter muito mais dificuldade em tarefas repetitivas ou pouco estimulantes.</p>

  { id: "cerebro", titulo: "O que acontece no cérebro",
    html: `<p>Pesquisas mostram que, em média, pessoas com TDAH apresentam diferenças no funcionamento e no amadurecimento de redes cerebrais ligadas às funções executivas, à motivação e à recompensa. Essas redes envolvem o córtex pré-frontal, os núcleos da base e o cerebelo, entre outras áreas.</p>
    <p>Dois mensageiros químicos têm papel importante nessas redes: a <strong>dopamina</strong>, ligada à motivação, à recompensa e ao início de ações, e a <strong>noradrenalina</strong>, ligada ao estado de alerta e à atenção. No TDAH, a forma como esses sistemas regulam a atenção e a motivação funciona de um jeito diferente.</p>
    <p>A genética tem grande influência: o TDAH costuma aparecer em mais de uma pessoa da mesma família. Fatores do ambiente, como algumas condições durante a gestação e o parto, também podem contribuir. Não existe uma causa única.</p>`,
    destaque: "Essas diferenças são médias de grupos de pesquisa. Nenhum exame de imagem ou de sangue faz o diagnóstico de TDAH: ele é feito por profissionais, com base em uma avaliação clínica cuidadosa." },
  { id: "sinais", titulo: "Os três grupos de sinais",
    html: "", trio: true,
    destaque: "Todo mundo se distrai, fica agitado ou age por impulso às vezes. No TDAH, esses sinais são mais frequentes, mais intensos, duram mais tempo e trazem prejuízos no dia a dia." },
  { id: "apresentacoes", titulo: "Jeitos diferentes de aparecer",
    html: `<p>Os manuais usados por profissionais de saúde (o DSM-5-TR e a CID-11) descrevem três formas principais de apresentação:</p>
    <ul class="ticks"><li><strong>Predominantemente desatenta:</strong> os sinais de desatenção são os mais marcantes.</li><li><strong>Predominantemente hiperativa-impulsiva:</strong> os sinais de agitação e impulsividade são os mais marcantes.</li><li><strong>Combinada:</strong> sinais dos dois grupos aparecem de forma importante.</li></ul>
    <p>Essas apresentações podem mudar ao longo da vida. Na adolescência, por exemplo, a hiperatividade costuma ficar menos visível e mais interna, enquanto a desatenção e a desorganização podem se destacar, porque as exigências da escola e da rotina aumentam.</p>`,

    html: `<p>Duas pessoas com TDAH podem ser muito diferentes entre si. A combinação de sinais, a intensidade, os interesses, as habilidades e o contexto de vida de cada uma mudam bastante a forma como o TDAH aparece.</p>
    <p>Em meninas, por exemplo, a desatenção e a inquietação interna costumam ser mais frequentes do que a agitação visível. Muitas vezes elas se esforçam muito para compensar as dificuldades, e os sinais podem passar despercebidos por mais tempo. Isso não é uma regra: é uma tendência observada em pesquisas.</p>

/* ---------------- ABA 7 — GUIA PARA A FAMÍLIA ---------------- */
const FAMILIA = {
  intro: "Este guia foi preparado para apoiar a família no processo de compreensão do TDAH. Ele reúne informações baseadas em evidências e orientações práticas para o dia a dia. Ele não substitui as conversas com os profissionais que acompanham sua filha, e cada orientação deve ser adaptada à realidade da família.",
  secoes: [
    { id: "f-comeco", titulo: "Para começar", html: `<p>Compreender o TDAH <strong>não significa retirar responsabilidades</strong>. Significa entender por que algumas tarefas exigem mais esforço e oferecer o tipo de apoio que ajuda a desenvolver habilidades e autonomia.</p><p>Também é importante lembrar que nem todo comportamento se explica pelo TDAH. Adolescentes passam por mudanças próprias da idade, têm personalidade, preferências e emoções que fazem parte de quem são. E a família não é a causa do TDAH: ela é parte importante da rede de apoio.</p>` },
    { id: "f-oque", titulo: "O que é o TDAH", html: `<p>O Transtorno do Déficit de Atenção e Hiperatividade é um transtorno do neurodesenvolvimento caracterizado por um padrão persistente de desatenção e/ou hiperatividade-impulsividade, presente em mais de um contexto e com impacto no funcionamento. Atinge cerca de 5% das crianças e adolescentes no mundo.</p><p>Tem forte componente genético e está associado a diferenças no funcionamento de redes cerebrais envolvidas nas funções executivas, na motivação e na recompensa, com participação dos sistemas de dopamina e noradrenalina. O diagnóstico é clínico, feito por profissionais habilitados, a partir de entrevistas, observações e informações de diferentes contextos.</p>` },
    { id: "f-adol", titulo: "O TDAH na adolescência", html: `<p>Na adolescência, as exigências mudam: mais matérias, mais professores, prazos mais longos, mais vida social e mais expectativa de autonomia. Ao mesmo tempo, as funções executivas ainda estão em pleno desenvolvimento.</p><ul class="ticks"><li>A hiperatividade costuma ficar menos visível e mais interna, como inquietação ou mente acelerada.</li><li>Desatenção, desorganização e dificuldade com prazos tendem a ganhar destaque.</li><li>As emoções podem ser mais intensas, e a autoestima fica mais sensível a críticas e comparações.</li><li>Em meninas, os sinais podem ser mais discretos e acompanhados de grande esforço para compensar, o que pode gerar cansaço e ansiedade.</li></ul>` },
    { id: "f-fe", titulo: "As funções executivas", html: `<p>As funções executivas são habilidades que permitem planejar, organizar, iniciar e concluir tarefas, controlar impulsos, manter informações na mente e ajustar emoções e comportamentos aos objetivos. As principais são: memória de trabalho, controle inibitório, flexibilidade cognitiva, planejamento e organização, gerenciamento do tempo e autorregulação.</p><p>No TDAH, essas habilidades costumam precisar de mais apoio externo, e por mais tempo, do que em outros adolescentes da mesma idade. Isso não quer dizer incapacidade: quer dizer que estrutura, previsibilidade e ferramentas fazem muita diferença.</p>` },
    { id: "f-org", titulo: "Organização, planejamento e memória de trabalho", html: `<p>Na prática, isso pode aparecer como esquecer materiais, perder prazos, começar várias coisas e não terminar, subestimar o tempo das tarefas ou se perder em instruções longas.</p><p>O que costuma ajudar é <strong>levar a informação para fora da cabeça</strong>: quadros, listas, agendas, alarmes, lugares fixos para objetos e rotinas previsíveis. A memória externa compensa a sobrecarga da memória de trabalho.</p>` },
    { id: "f-emo", titulo: "Regulação emocional", html: `<p>Muitos adolescentes com TDAH sentem emoções com mais intensidade e têm mais dificuldade para voltar à calma. A frustração pode surgir rápido, principalmente diante de mudanças inesperadas, críticas ou tarefas difíceis.</p><p>Nesses momentos, discutir ou dar sermão costuma piorar. Ajuda mais <strong>nomear a emoção, oferecer uma pausa e retomar a conversa depois</strong>, quando todos estiverem mais calmos. Adultos que mostram como regulam as próprias emoções também ensinam pelo exemplo.</p>` },
    { id: "f-auto", titulo: "Autoestima e autoconfiança", html: `<p>Crianças e adolescentes com TDAH frequentemente ouvem mais correções e críticas do que elogios. Com o tempo, isso pode virar uma ideia de que “eu sou o problema”. Fortalecer a autoestima é parte essencial do cuidado.</p><ul class="ticks"><li>Reconheça esforços, não só resultados.</li><li>Valorize interesses e talentos, como música, patins e criatividade.</li><li>Separe a pessoa do comportamento: “essa atitude não foi legal” é diferente de “você é…”.</li><li>Garanta momentos de convivência que não sejam sobre tarefas ou cobranças.</li></ul>` },
    { id: "f-escola", titulo: "Vida escolar", html: `<p>Uma parceria próxima com a escola costuma ser muito útil. Vale compartilhar, com o consentimento da adolescente, o que ajuda e o que atrapalha, e combinar estratégias como instruções por escrito, divisão de trabalhos longos em etapas com prazos intermediários, lugar na sala com menos distrações e confirmação de tarefas na agenda.</p><p>No Brasil, a Lei nº 14.254/2021 prevê o acompanhamento integral de estudantes com TDAH, dislexia ou outros transtornos de aprendizagem na educação básica.</p>` },
    { id: "f-familia", titulo: "Relações familiares", html: `<p>O TDAH pode trazer tensão para a rotina: atrasos, esquecimentos e combinados não cumpridos geram cansaço para todos. É comum que a relação fique centrada em cobranças. Buscar momentos leves e prazerosos juntos ajuda a proteger o vínculo, que é o principal fator de apoio.</p><p>Cuidar de quem cuida também importa: pais e responsáveis cansados têm mais dificuldade para manter a calma. Pedir ajuda, dividir tarefas e ter espaço para si faz parte do processo.</p>` },
    { id: "f-autonomia", titulo: "Autonomia e desenvolvimento", html: `<p>A autonomia se constrói aos poucos. Uma forma útil de pensar é em três degraus:</p><ul class="ticks"><li><strong>Fazer junto:</strong> o adulto mostra e faz com a adolescente.</li><li><strong>Acompanhar de perto:</strong> a adolescente faz e o adulto confere.</li><li><strong>Acompanhar de longe:</strong> a adolescente faz sozinha, com combinados de verificação.</li></ul><p>Retirar o apoio de uma vez costuma não funcionar. Retirar aos poucos, conforme as habilidades aparecem, sim.</p>` },

  for (let i = 0; i < n * 2; i++) { const a = ((rot + (i * 180) / n) * Math.PI) / 180; const rad = i % 2 ? r : R; p.push((cx + rad * Math.cos(a)).toFixed(1) + "," + (cy + rad * Math.sin(a)).toFixed(1)); }
  return p.join(" ");
}

  else if (shape === "mic") body = `<g><path d="M14 21.5h12l-3 13.5a3 3 0 0 1-6 0z" fill="#3B2860"/><circle cx="20" cy="13" r="10" fill="${c}"/><path d="M12 10.5h16M11 14.5h18M15.5 5.5v15M20 3v20M24.5 5.5v15" stroke="#fff" stroke-opacity=".38" stroke-width="1.3"/><rect x="13.5" y="21" width="13" height="3.2" rx="1.6" fill="${c}"/></g>`;

/* ---------- Áudio (sons suaves dos jogos e do temporizador) ---------- */
let AC = null;
function tone(freq = 440, dur = 0.25, type = "sine", vol = 0.18, when = 0) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
const chime = () => { tone(523, 0.3, "sine", 0.16); tone(659, 0.3, "sine", 0.16, 0.12); tone(784, 0.5, "sine", 0.16, 0.24); };
const softNo = () => tone(220, 0.22, "triangle", 0.1);

/* ---------- Progresso e conquistas ---------- */
const doneCount = () => STAGES.filter((s) => S.done[s.id]).length;
const allDone = () => doneCount() === STAGES.length;
let badgeQueue = [];
function checkStages() {
  const rules = {
    cerebro: () => Object.keys(S.efSeen).length >= EF_CARDS.length,
    tdah: () => Object.keys(S.quiz.ans).length >= QUIZ.length,
    comigo: () => Object.keys(S.cards.ans).length >= 10,
    desafios: () => Object.keys(S.games).length >= 3,
    ferramentas: () => Object.keys(S.toolsSeen).length >= 3,
    manual: () => S.manualDone,
  };
  STAGES.forEach((st) => { if (!S.done[st.id] && rules[st.id]()) completeStage(st.id, true); });
}
function completeStage(id, auto = false) {
  if (S.done[id]) return;
  S.done[id] = true; save(); badgeQueue.push(id); updateNav();
  if (!$("#modal-root").innerHTML) showNextBadge();
}
function showNextBadge() {
  const id = badgeQueue.shift(); if (!id) return;
  const st = STAGES.find((s) => s.id === id);
  const fim = allDone();
  burst();
  chime();
  openModal(`<div class="modal-body" style="text-align:center;padding-top:34px;align-items:center">
    <div class="badge-medal">${medalSVG(st, true, 120)}</div>
    <span class="eyebrow">${starFill(14)} Conquista desbloqueada</span>
    <h2>${st.badge}</h2>
    <p class="muted" style="max-width:36ch">${st.badgeMsg}. ${fim ? "Você completou todas as etapas do percurso!" : `Mais uma estrela no seu percurso: ${doneCount()} de ${STAGES.length}.`}</p>
    <div class="row" style="justify-content:center;margin-top:6px">
      ${fim ? `<a class="btn btn-primary" href="#final" data-act="closeModal">${icon("star")} Ver encerramento</a>` : `<button class="btn btn-primary" data-act="closeModal">Continuar</button>`}
      <a class="btn btn-ghost" href="#inicio" data-act="closeModal">Ver meu percurso</a>
    </div></div>`);
  updateNav();
  if ((location.hash || "#inicio") === "#inicio") positionSkater();
}
function burst() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const b = document.createElement("div"); b.className = "burst";
  const cols = ["#F2D47E", "#91D8C9", "#C6B2E8", "#E9A4AD", "#A9C9E9", "#7656A8"];
  for (let i = 0; i < 36; i++) {
    const s = document.createElement("i"); const size = 8 + Math.random() * 14;
    s.style.left = Math.random() * 100 + "vw"; s.style.animationDuration = 1.8 + Math.random() * 1.8 + "s"; s.style.animationDelay = Math.random() * 0.4 + "s";
    s.innerHTML = Math.random() > 0.35 ? `<svg width="${size}" height="${size}" viewBox="0 0 24 24"><polygon points="${starPts(12, 12, 11, 4.6)}" fill="${pick(cols)}"/></svg>` : `<svg width="${size}" height="${size}" viewBox="0 0 40 40" style="color:${pick(cols)}"><g fill="currentColor"><ellipse cx="13.5" cy="29.5" rx="7" ry="5.2"/><rect x="18.4" y="5" width="3.4" height="25"/></g></svg>`;
    b.appendChild(s);
  }
  document.body.appendChild(b); setTimeout(() => b.remove(), 4200);
}

  $("#modal-root").innerHTML = "";

/* ---------- Roteador ---------- */
const VIEWS = {};
function route() {
  const h = (location.hash || "#inicio").slice(1);
  const key = VIEWS[h] ? h : "inicio";
  document.body.classList.toggle("standalone", key === "familia-compartilhar");
  if (key !== "desafios") stopAllGames();
  const v = $("#view");
  v.innerHTML = `<div class="view" id="v-${key}">${VIEWS[key].render()}</div>`;
  VIEWS[key].mount && VIEWS[key].mount();
  updateNav(); A.closeNav();
  window.scrollTo(0, 0);
  const h1 = v.querySelector("h1"); if (h1) { h1.setAttribute("tabindex", "-1"); h1.focus({ preventScroll: true }); }
}

const TRACK_D = "M30,120 C120,30 200,30 260,90 S380,160 450,100 S580,20 650,80 S780,150 840,90 S940,40 975,60";
function trackSVG() {
  return `<svg class="track-svg" viewBox="0 0 1000 170" role="img" aria-label="Pista de patinação com seis paradas: ${doneCount()} concluídas">
    <path d="${TRACK_D}" fill="none" stroke="#F0EAFA" stroke-width="30" stroke-linecap="round"/>
    <path id="trackPath" d="${TRACK_D}" fill="none" stroke="#C6B2E8" stroke-width="4" stroke-dasharray="3 12" stroke-linecap="round"/>
    <path id="trackDone" d="${TRACK_D}" fill="none" stroke="#91D8C9" stroke-width="6" stroke-linecap="round" stroke-dasharray="0 9999"/>
    <g id="trackStops"></g>
    <g id="skater" class="skater"><g transform="translate(-22 -58)"><circle cx="22" cy="30" r="26" fill="#fff" opacity=".9"/><g transform="translate(4 8) scale(.9)">${sym("skate", "roxo").replace("<svg", '<svg width="40" height="40"')}</g></g></g>
  </svg>`;
}
function positionSkater() {
  const p = $("#trackPath"); if (!p) return;
  const L = p.getTotalLength(); const stops = STAGES.map((s, i) => (L * (i + 0.6)) / (STAGES.length + 0.2));
  $("#trackStops").innerHTML = STAGES.map((s, i) => {
    const pt = p.getPointAtLength(stops[i]); const on = !!S.done[s.id];
    return `<a href="#${s.id}" aria-label="${s.nome}"><g transform="translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)})"><circle r="21" fill="${on ? "#F2D47E" : "#fff"}" stroke="${on ? "#D9B44A" : "#C6B2E8"}" stroke-width="3"/>${on ? `<polygon points="${starPts(0, 1, 12, 5.2)}" fill="#fff"/>` : `<text y="6" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="700" font-size="17" fill="#7656A8">${s.n}</text>`}</g></a>`;
  }).join("");
  const n = doneCount(); const at = n === 0 ? 0 : stops[Math.min(n, STAGES.length) - 1];
  const pt = p.getPointAtLength(at);
  $("#skater").setAttribute("transform", `translate(${pt.x.toFixed(1)} ${pt.y.toFixed(1)})`);
  $("#trackDone").setAttribute("stroke-dasharray", `${at} 9999`);
}

/* ---------- 1. Holofote (atenção) ---------- */
const ATT_ROUNDS = [
  { cols: 5, target: ["star", "amarelo"], n: 5, pool: () => [pick(["note", "mic", "skate"]), pick(Object.keys(SYM_COLORS))] },
  { cols: 6, target: ["note", "agua"], n: 6, pool: () => (Math.random() < 0.5 ? ["note", pick(["roxo", "coral", "azul", "amarelo", "lilas"])] : [pick(["star", "mic", "skate"]), Math.random() < 0.5 ? "agua" : pick(Object.keys(SYM_COLORS))]) },
  { cols: 6, target: ["skate", "roxo"], n: 6, distract: true, pool: () => (Math.random() < 0.45 ? ["skate", pick(["lilas", "azul", "coral"])] : [pick(["star", "mic", "note"]), Math.random() < 0.6 ? "roxo" : pick(Object.keys(SYM_COLORS))]) },
];
function attStart() { G.att = { round: 0 }; attRound(); }
function attRound() {
  const R = ATT_ROUNDS[G.att.round]; const total = R.cols * R.cols;
  const pos = new Set(shuffle([...Array(total).keys()]).slice(0, R.n));
  const cells = [...Array(total)].map((_, i) => {
    if (pos.has(i)) return { s: R.target[0], c: R.target[1], t: true };
    let d; do { d = R.pool(); } while (d[0] === R.target[0] && d[1] === R.target[1]);
    return { s: d[0], c: d[1], t: false };
  });
  G.att.cells = cells; G.att.found = 0; G.att.n = R.n;
  const g = GAMES[0]; const tName = ["estrelas amarelas", "notas musicais verde-água", "patins roxos"][G.att.round];
  gameArea().innerHTML = `${gameHeader(g)}
  <div class="row" style="justify-content:space-between;margin-bottom:14px"><p class="game-instr">Rodada ${G.att.round + 1} de ${ATT_ROUNDS.length}: encontre todos os <span class="target-pill">${sym(R.target[0], R.target[1])} ${tName}</span></p><span class="gstatus" id="att-status" aria-live="polite">Encontrados: 0 de ${R.n}</span></div>
  ${R.distract ? `<p class="muted" style="font-size:.9rem;margin-bottom:10px">Atenção: nesta rodada, algumas coisas vão passar flutuando pela tela. Tente manter o foco no seu alvo.</p>` : ""}
  <div class="att-grid" id="att-grid" style="grid-template-columns:repeat(${R.cols},minmax(0,1fr))">${cells.map((c, i) => `<button class="att-cell" data-act="attCell" data-i="${i}" aria-label="${SHAPE_NOMES[c.s]} ${SYM_NOMES[c.c]}">${sym(c.s, c.c)}</button>`).join("")}${R.distract ? `<div class="distract-layer" id="distract"></div>` : ""}</div>
  <div id="att-next" style="margin-top:16px;text-align:center"></div>`;
  if (R.distract) attDistract();
}
function attDistract() {
  const layer = $("#distract"); if (!layer || !G.att) return;
  const sp = document.createElement("span"); const size = 26 + Math.random() * 26;
  sp.style.left = Math.random() * 85 + "%"; sp.style.top = 40 + Math.random() * 55 + "%"; sp.style.width = size + "px"; sp.style.height = size + "px";
  sp.innerHTML = sym(pick(["note", "star"]), pick(["amarelo", "coral", "agua"])); layer.appendChild(sp);
  setTimeout(() => sp.remove(), 5000); gLater(attDistract, 700);
}
A.attCell = (el) => {
  const c = G.att.cells[+el.dataset.i]; if (el.classList.contains("found")) return;
  if (c.t) {
    el.classList.add("found"); G.att.found++; tone(660 + G.att.found * 40, 0.15, "sine", 0.12);
    $("#att-status").textContent = `Encontrados: ${G.att.found} de ${G.att.n}`;
    if (G.att.found === G.att.n) {

      $("#att-next").innerHTML = `<div class="note agua" style="justify-content:center;margin-bottom:12px">${starFill(18)}<span>Você encontrou todos! ${last ? "Essa era a última rodada." : "A próxima rodada é um pouco mais desafiadora."}</span></div>${last ? `<button class="btn btn-primary" data-act="gameEnd">Ver o que esse jogo mostra ${icon("arrowR", 18)}</button>` : `<button class="btn btn-primary" data-act="attNext">Próxima rodada ${icon("arrowR", 18)}</button>`}`;
    }
  } else { el.classList.remove("nope"); void el.offsetWidth; el.classList.add("nope"); softNo(); }
};

/* ---------- 2. Sequência musical (memória de trabalho) ---------- */
const PADS = [
  { s: "star", c: "amarelo", f: 523.25, bg: "#FBF0CF" },
  { s: "note", c: "agua", f: 392.0, bg: "#DDF4EF" },
  { s: "mic", c: "roxo", f: 329.63, bg: "#ECE4F8" },
  { s: "skate", c: "coral", f: 261.63, bg: "#FBE5E8" },
];
function memStart() {
  G.mem = { seq: [], pos: 0, phase: "idle" };
  gameArea().innerHTML = `${gameHeader(GAMES[1])}
  <p class="game-instr" style="text-align:center">Observe a sequência de luzes e sons. Depois, toque nos símbolos na mesma ordem. A cada acerto, a sequência ganha mais um elemento.</p>
  <div class="simon" id="simon">${PADS.map((p, i) => `<button class="pad" data-act="memPad" data-i="${i}" style="background:${p.bg};color:${SYM_COLORS[p.c]}" aria-label="${SHAPE_NOMES[p.s]}" disabled>${sym(p.s, p.c)}</button>`).join("")}</div>
  <p id="mem-status" class="gstatus" style="text-align:center;min-height:1.6em" aria-live="polite">Pronta? Aperte começar.</p>
  <div id="mem-ctrl" class="row" style="justify-content:center;margin-top:8px"><button class="btn btn-primary" data-act="memGo">${icon("play", 18)} Começar</button></div>
  <p class="muted" style="text-align:center;font-size:.88rem;margin-top:14px">Dica: experimente dar nomes, cantar a sequência ou imaginar uma coreografia.</p>`;
}
function memLight(i, dur = 420) {
  const b = $$("#simon .pad")[i]; if (!b) return;
  b.classList.add("lit"); tone(PADS[i].f, dur / 1000, "sine", 0.2); setTimeout(() => b.classList.remove("lit"), dur);
}
function memSetPads(on) { $$("#simon .pad").forEach((b) => (b.disabled = !on)); }
A.memGo = () => { G.mem.seq = [Math.floor(Math.random() * 4), Math.floor(Math.random() * 4)]; memPlay(); };
function memPlay() {
  G.mem.phase = "watch"; G.mem.pos = 0; memSetPads(false);
  $("#mem-ctrl").innerHTML = ""; $("#mem-status").textContent = `Observe... (sequência de ${G.mem.seq.length})`;
  G.mem.seq.forEach((v, k) => gLater(() => memLight(v), 700 + k * 720));
  gLater(() => { G.mem.phase = "play"; memSetPads(true); $("#mem-status").textContent = "Sua vez!"; }, 700 + G.mem.seq.length * 720);
}
A.memPad = (el) => {
  if (G.mem.phase !== "play") return; const i = +el.dataset.i; memLight(i, 260);
  if (i === G.mem.seq[G.mem.pos]) {
    G.mem.pos++;
    if (G.mem.pos === G.mem.seq.length) {
      G.mem.phase = "watch"; memSetPads(false);
      $("#mem-status").textContent = pick(["Isso! Lá vem uma sequência maior.", "Mandou bem! Mais um elemento.", "Boa! Prepare-se."]);

/* ---------- 3. Hora do aplauso (controle inibitório) ---------- */
const INH_PHASES = [

    gen: () => { const r = Math.random(); return r < 0.5 ? { k: "mic", spot: true, go: true } : r < 0.8 ? { k: "mic", spot: false, go: false } : { k: "shh", spot: Math.random() < 0.5, go: false }; } },
];

function inhStart() { G.inh = { phase: 0 }; inhIntro(); }
function inhIntro() {
  const P = INH_PHASES[G.inh.phase];
  gameArea().innerHTML = `${gameHeader(GAMES[2])}
  <div class="stack" style="align-items:center;text-align:center"><span class="tag coral">Parte ${G.inh.phase + 1} de ${INH_PHASES.length}</span><p class="game-instr prose">${P.regra}</p>
  <div class="row" style="justify-content:center;gap:24px"><div class="stack" style="align-items:center;gap:4px"><div style="width:80px;height:80px">${sym("mic", "amarelo")}</div><span class="tag agua">${G.inh.phase ? "com holofote: aplauda" : "aplauda"}</span></div><div class="stack" style="align-items:center;gap:4px"><div style="width:80px;height:80px;display:grid;place-items:center">${SHH_SVG.replace('width="120" height="120"', 'width="80" height="80"')}</div><span class="tag coral">segure</span></div></div>

A.inhGo = () => {

  gameArea().innerHTML = `${gameHeader(GAMES[2])}
  <p class="game-instr" style="text-align:center">${P.regra}</p>
  <div class="stage-box" id="inh-stage"><div class="spot" id="inh-spot"></div><div id="inh-stim"></div><div class="stage-floor"></div><div class="flash" id="inh-flash" aria-live="polite"></div></div>
  <div style="text-align:center"><button class="btn btn-roxo clap-btn" data-act="inhClap">${icon("hand", 22)} Aplaudir</button></div>`;
  G.keyHandler = (e) => { if (e.code === "Space" && G.running) { e.preventDefault(); A.inhClap(); } };
  document.addEventListener("keydown", G.keyHandler);
  gLater(inhNext, 900);
};
function inhNext() {
  G.inh.t++; const stim = $("#inh-stim"); if (!stim) return;
  if (G.inh.t >= G.inh.trials.length) {
    G.running = false;
    if (G.inh.phase < INH_PHASES.length - 1) {
      gameArea().querySelector(".stage-box").insertAdjacentHTML("afterend", `<div class="stack" style="align-items:center;text-align:center"><div class="note agua">${starFill(18)}<span>Parte ${G.inh.phase + 1} concluída! Pronta para uma regra nova?</span></div><button class="btn btn-primary" data-act="inhPhase2">Próxima parte ${icon("arrowR", 18)}</button></div>`);

  if (!G.running || !G.inh || G.inh.t < 0) return; const tr = G.inh.trials[G.inh.t]; if (!tr || tr.clapped || !$("#inh-stim").innerHTML) return;
  tr.clapped = true; const fl = $("#inh-flash");
  if (tr.go) { tone(880, 0.1, "triangle", 0.12); tone(1175, 0.12, "triangle", 0.1, 0.06); fl.textContent = pick(["Aplausos!", "Isso!", "No tempo certo!"]); }
  else { softNo(); fl.textContent = "Ops, era hora de segurar. Tudo bem, segue o show!"; }
};

/* ---------- 4. Rumo ao show (planejamento) ---------- */
function planStart(scId) {
  const sc = PLAN_SCENARIOS.find((s) => s.id === scId) || PLAN_SCENARIOS[0];
  G.plan = { sc, bank: shuffle(sc.steps.map((s) => s.id)), plan: [], checked: false, bad: [] };
  planRender();
}
function planRender() {
  const { sc, bank, plan, bad } = G.plan; const step = (id) => sc.steps.find((s) => s.id === id);
  gameArea().innerHTML = `${gameHeader(GAMES[3])}
  <div class="row" style="margin-bottom:14px">${PLAN_SCENARIOS.map((s) => `<button class="chip ${s.id === sc.id ? "on" : ""}" data-act="planSc" data-id="${s.id}">${icon(s.icon, 15)} ${s.nome}</button>`).join("")}</div>
  <p class="game-instr">Objetivo: <b>${sc.nome}</b>. Toque nas etapas para montar o seu plano na ordem em que você faria. Use as setas para trocar de lugar.</p>

    <div><h4 style="margin-bottom:8px">Etapas disponíveis</h4><div class="plan-list" style="background:var(--surface);border-style:solid;border-color:var(--line)">${bank.length ? bank.map((id) => `<button class="plan-item bank" data-act="planAdd" data-id="${id}">${icon("plus", 16)}<span class="grow">${step(id).t}</span></button>`).join("") : `<p class="muted" style="text-align:center;padding:20px 0">Todas as etapas estão no plano.</p>`}</div></div>
    <div><h4 style="margin-bottom:8px">Meu plano</h4><div class="plan-list">${plan.length ? plan.map((id, i) => `<div class="plan-item ${bad.includes(id) ? "warn" : ""}"><span class="pn">${i + 1}</span><span class="grow">${step(id).t}</span><button class="mini" data-act="planMove" data-i="${i}" data-d="-1" aria-label="Subir">${icon("up", 16)}</button><button class="mini" data-act="planMove" data-i="${i}" data-d="1" aria-label="Descer">${icon("down", 16)}</button><button class="mini" data-act="planDel" data-i="${i}" aria-label="Remover">${icon("x", 16)}</button></div>`).join("") : `<p class="muted" style="text-align:center;padding:20px 0">Seu plano aparece aqui.</p>`}</div></div>
  </div>
  <div id="plan-fb" style="margin-top:16px" aria-live="polite">${G.plan.fb || ""}</div>
  <div class="row" style="margin-top:14px"><button class="btn btn-primary" data-act="planCheck" ${bank.length ? "disabled" : ""}>${icon("check", 18)} Conferir meu plano</button><button class="btn btn-ghost" data-act="planSc" data-id="${sc.id}">${icon("refresh", 18)} Recomeçar</button></div>`;
}
A.planSc = (el) => planStart(el.dataset.id);
A.planAdd = (el) => { const id = el.dataset.id; G.plan.bank = G.plan.bank.filter((x) => x !== id); G.plan.plan.push(id); G.plan.bad = []; G.plan.fb = ""; tone(587, 0.08, "sine", 0.08); planRender(); };
A.planDel = (el) => { const id = G.plan.plan.splice(+el.dataset.i, 1)[0]; G.plan.bank.push(id); G.plan.bad = []; G.plan.fb = ""; planRender(); };
A.planMove = (el) => { const i = +el.dataset.i, j = i + +el.dataset.d; const p = G.plan.plan; if (j < 0 || j >= p.length) return; [p[i], p[j]] = [p[j], p[i]]; G.plan.bad = []; G.plan.fb = ""; planRender(); };
A.planCheck = () => {
  const { sc, plan } = G.plan; const pos = Object.fromEntries(plan.map((id, i) => [id, i])); const issues = [];
  plan.forEach((id) => { const s = sc.steps.find((x) => x.id === id); s.dep.forEach((d) => { if (pos[d] > pos[id]) issues.push([id, d]); }); });
  G.plan.bad = [...new Set(issues.map((x) => x[0]))];
  if (!issues.length) {
    G.plan.fb = `<div class="note agua">${starFill(18)}<span><b>Seu plano funciona!</b> Cada etapa vem depois daquilo de que ela precisa. Repare que algumas etapas poderiam estar em outra ordem e o plano continuaria funcionando: quase sempre existe mais de um bom caminho.</span></div><div class="row" style="margin-top:12px"><button class="btn btn-roxo" data-act="gameEnd">Ver o que esse jogo mostra ${icon("arrowR", 18)}</button></div>`;
    chime(); planRender(); S.games.planejamento = true; save(); $("#games-grid").innerHTML = gamesGrid(); afterProgress("desafios");
  } else {
    const nm = (id) => sc.steps.find((x) => x.id === id).t;
    G.plan.fb = `<div class="note amarelo">${icon("bulb")}<span>Quase lá! Algumas etapas precisam de outras antes delas:<ul style="margin:6px 0 0;padding-left:18px">${issues.map(([a, b]) => `<li>“${nm(a)}” precisa vir depois de “${nm(b)}”.</li>`).join("")}</ul>Use as setas para reorganizar e confira de novo.</span></div>`;
    softNo(); planRender();
  }
};

/* ---------- 5. Troca de ritmo (flexibilidade cognitiva) ---------- */
const FLEX_TARGETS = [{ s: "star", c: "roxo", n: 1 }, { s: "note", c: "agua", n: 2 }, { s: "mic", c: "coral", n: 3 }];
const FLEX_PHASES = [
  { regra: "cor", n: 6, txt: "Separe cada carta pela <b>COR</b>: coloque na pilha que tem a mesma cor." },
  { regra: "forma", n: 6, txt: "A regra mudou! Agora separe pela <b>FORMA</b>: coloque na pilha que tem o mesmo símbolo." },
  { regra: "misto", n: 8, txt: "Regra final: olhe a <b>borda</b> da carta. Borda <b>dourada contínua</b> = separe pela COR. Borda <b>roxa tracejada</b> = separe pela FORMA." },
];
function flexCard() {
  let s, c; do { s = Math.floor(Math.random() * 3); c = Math.floor(Math.random() * 3); } while (s === c);
  return { s: FLEX_TARGETS[s].s, si: s, c: FLEX_TARGETS[c].c, ci: c, n: 1 + Math.floor(Math.random() * 3), rule: Math.random() < 0.5 ? "cor" : "forma" };
}
function fcardHTML(card, big = false, cls = "") { return `<div class="fcard ${big ? "big" : ""} ${cls}">${Array.from({ length: card.n }, () => sym(card.s, card.c)).join("")}</div>`; }
function flexStart() { G.flex = { phase: 0, k: 0 }; flexIntro(true); }
function flexIntro(first) {
  const P = FLEX_PHASES[G.flex.phase];
  gameArea().innerHTML = `${gameHeader(GAMES[4])}
  <div class="stack" style="align-items:center;text-align:center"><span class="rule-banner ${first ? "" : "changed"}">${icon("shuffle", 18)} ${first ? "Primeira regra" : "A regra mudou!"}</span><p class="game-instr prose">${P.txt}</p>
  ${P.regra === "misto" ? `<div class="row" style="justify-content:center;gap:20px"><div class="stack" style="align-items:center;gap:6px">${fcardHTML({ s: "note", c: "coral", n: 1 }, false, "rule-cor")}<span class="tag amarelo">pela COR</span></div><div class="stack" style="align-items:center;gap:6px">${fcardHTML({ s: "note", c: "coral", n: 1 }, false, "rule-forma")}<span class="tag">pela FORMA</span></div></div>` : ""}
  <button class="btn btn-primary" data-act="flexGo">${icon("play", 18)} ${first ? "Começar" : "Continuar"}</button></div>`;
}
A.flexGo = () => { G.flex.k = 0; flexDeal(); };
function flexDeal() {
  const P = FLEX_PHASES[G.flex.phase]; G.flex.card = flexCard(); const card = G.flex.card;
  const rule = P.regra === "misto" ? card.rule : P.regra;
  const ruleTxt = P.regra === "misto" ? "Olhe a borda da carta" : rule === "cor" ? "Regra: COR" : "Regra: FORMA";
  gameArea().innerHTML = `${gameHeader(GAMES[4])}
  <div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="rule-banner">${icon("shuffle", 18)} ${ruleTxt}</span><span class="gstatus">Parte ${G.flex.phase + 1} de 3 · carta ${G.flex.k + 1} de ${P.n}</span></div>
  <div style="display:grid;place-items:center;margin:8px 0 6px">${fcardHTML(card, true, P.regra === "misto" ? (card.rule === "cor" ? "rule-cor" : "rule-forma") : "")}</div>
  <p class="muted" style="text-align:center;font-size:.9rem">Em qual pilha essa carta vai?</p>
  <div class="flex-table">${FLEX_TARGETS.map((t, i) => `<button class="bin" data-act="flexPick" data-i="${i}" aria-label="Pilha ${i + 1}: ${t.n} ${SHAPE_NOMES[t.s]} ${SYM_NOMES[t.c]}">${fcardHTML(t)}</button>`).join("")}</div>
  <p id="flex-fb" class="gstatus" style="text-align:center;margin-top:12px;min-height:1.6em" aria-live="polite"></p>`;
}
A.flexPick = (el) => {
  if (G.flex.lock) return; const P = FLEX_PHASES[G.flex.phase]; const card = G.flex.card;
  const rule = P.regra === "misto" ? card.rule : P.regra; const right = rule === "cor" ? card.ci : card.si; const i = +el.dataset.i;
  G.flex.lock = true;
  if (i === right) { el.classList.add("good"); tone(698, 0.14, "sine", 0.12); $("#flex-fb").textContent = pick(["Isso!", "Boa!", "Certinho!"]); }
  else { el.classList.add("bad"); $$(".bin")[right].classList.add("good"); softNo(); $("#flex-fb").textContent = `Pela regra de agora (${rule === "cor" ? "cor" : "forma"}), ela vai na pilha destacada.`; }
  gLater(() => {
    G.flex.lock = false; G.flex.k++;
    if (G.flex.k >= P.n) { if (G.flex.phase < FLEX_PHASES.length - 1) { G.flex.phase++; flexIntro(false); } else finishGame("flexibilidade"); }
    else flexDeal();
  }, i === right ? 650 : 1500);
};

/* Temporizador */
const TM = { total: 15 * 60, left: 15 * 60, running: false, iv: null, label: "Foco", ended: false };
function fmt(s) { const m = Math.floor(s / 60), r = s % 60; return `${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`; }
function timerHTML() {
  const presets = [[5, "5 min"], [10, "10 min"], [15, "15 min"], [25, "25 min"]];
  return `<div class="timer-wrap"><div class="vinyl ${TM.running ? "spin" : ""}" id="vinyl">
    <svg viewBox="0 0 240 240" aria-hidden="true"><circle cx="120" cy="120" r="114" fill="none" stroke="#F0EAFA" stroke-width="10"/><circle id="tm-ring" cx="120" cy="120" r="114" fill="none" stroke="#91D8C9" stroke-width="10" stroke-linecap="round" transform="rotate(-90 120 120)" stroke-dasharray="716.3" stroke-dashoffset="0"/>
    <g class="disc"><circle cx="120" cy="120" r="100" fill="#3B2860"/><circle cx="120" cy="120" r="88" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/><circle cx="120" cy="120" r="76" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/><circle cx="120" cy="120" r="64" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/><path d="M60 80a72 72 0 0 1 40-26" stroke="#fff" stroke-opacity=".25" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="120" cy="120" r="40" fill="#C6B2E8"/><polygon points="${starPts(120, 96, 9, 4)}" fill="#F2D47E"/><circle cx="120" cy="120" r="4" fill="#3B2860"/></g></svg>
    <div class="time"><span id="tm-time">${fmt(TM.left)}</span></div></div>
    <div class="stack"><div><h3>Temporizador</h3><p class="muted" style="font-size:.92rem">Escolha um tempo que pareça possível. O disco gira enquanto o tempo corre e o anel mostra quanto falta.</p></div>
      <div class="row" style="gap:8px">${presets.map(([m, l]) => `<button class="chip ${TM.total === m * 60 ? "on" : ""}" data-act="tmSet" data-m="${m}">${l}</button>`).join("")}<button class="chip agua ${TM.total === 300 && TM.label === "Pausa" ? "on" : ""}" data-act="tmPause">Pausa de 5 min</button></div>
      <div class="row" style="gap:8px"><button class="btn btn-soft btn-sm" data-act="tmAdj" data-d="-1" ${TM.running ? "disabled" : ""}>− 1 min</button><button class="btn btn-soft btn-sm" data-act="tmAdj" data-d="1" ${TM.running ? "disabled" : ""}>+ 1 min</button><span class="tag ${TM.label === "Pausa" ? "agua" : ""}">${TM.label === "Pausa" ? "Modo pausa" : "Modo foco"}</span></div>
      <div class="row"><button class="btn ${TM.running ? "btn-ghost" : "btn-primary"}" data-act="tmToggle">${TM.running ? icon("pause", 18) + " Pausar" : icon("play", 18) + (TM.left < TM.total && TM.left > 0 ? " Continuar" : " Iniciar")}</button><button class="btn btn-ghost" data-act="tmReset">${icon("refresh", 18)} Zerar</button></div>
      <div id="tm-msg" aria-live="polite">${TM.ended ? `<div class="note agua">${starFill(18)}<span>${TM.label === "Pausa" ? "Fim da pausa! Hora de voltar com calma." : "Tempo concluído! Que tal uma pausa curta antes do próximo ciclo?"}</span></div>` : ""}</div>
    </div></div>`;
}
function timerPaint() {
  const t = $("#tm-time"); if (t) t.textContent = fmt(TM.left);
  const r = $("#tm-ring"); if (r) r.setAttribute("stroke-dashoffset", (716.3 * (1 - TM.left / TM.total)).toFixed(1));
}
function stopTimer(reset) { clearInterval(TM.iv); TM.iv = null; TM.running = false; if (reset) { TM.left = TM.total; TM.ended = false; } }
A.tmSet = (el) => { stopTimer(); TM.total = TM.left = +el.dataset.m * 60; TM.label = "Foco"; TM.ended = false; renderRes(); };
A.tmPause = () => { stopTimer(); TM.total = TM.left = 300; TM.label = "Pausa"; TM.ended = false; renderRes(); };
A.tmAdj = (el) => { const m = Math.max(1, Math.min(90, Math.round(TM.total / 60) + +el.dataset.d)); TM.total = TM.left = m * 60; TM.ended = false; renderRes(); };
A.tmReset = () => { stopTimer(true); renderRes(); };
A.tmToggle = () => {
  if (TM.running) { stopTimer(); renderRes(); return; }
  if (TM.left <= 0) TM.left = TM.total; TM.ended = false; TM.running = true;
  tone(523, 0.1, "sine", 0.08);
  TM.iv = setInterval(() => {
    TM.left--; timerPaint();
    if (TM.left <= 0) { stopTimer(); TM.left = 0; TM.ended = true; chime(); setTimeout(chime, 900); if ($("#vinyl")) renderRes(); else toast(TM.label === "Pausa" ? "Fim da pausa!" : "Tempo do temporizador concluído!"); }
  }, 1000);
  renderRes();
};

/* Planejador de pequenas etapas */

  const P = S.plan; const done = P.steps.filter((s) => s.done).length;
  return `<div class="steps-plan stack"><div><h3>Planejador de pequenas etapas</h3><p class="muted" style="font-size:.92rem">Escreva uma tarefa grande e quebre em passos pequenos e concretos. Cada passo concluído acende uma estrela.</p></div>
