<title>Seu mundo, seu ritmo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Site interativo de psicoeducação sobre TDAH para adolescentes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400..800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
/* Layout: barra lateral escura (setlist de missões) + palco claro; cada missão abre com uma faixa escura e um passo a passo flexível. */
:root{
  /* paleta original */
  --roxo:#7656A8; --lilas:#C6B2E8; --agua:#91D8C9; --amarelo:#F2D47E; --coral:#E9A4AD; --azul:#A9C9E9;
  /* derivados */
  --night:#211936; --night-2:#2D2349; --night-3:#3A2E5C; --on-night:#EDE7F8; --on-night-2:#B9AED3;
  --roxo-ink:#5B3F8C; --lilas-soft:#EFE9F9; --lilas-mid:#DCD0F1;
  --agua-ink:#1C6A5B; --agua-soft:#E2F4EF; --agua-mid:#BDE8DE;
  --coral-ink:#9E3D4B; --coral-soft:#FBEAEC; --amarelo-ink:#7A5C0E; --amarelo-soft:#FBF3D9; --azul-ink:#2C5986; --azul-soft:#E7F0F9;
  --bg:#F6F4FA; --surface:#FFFFFF; --ink:#1D1730; --ink-2:#554C6C; --line:#E5DFEF; --line-2:#D6CDE6;
  --r-lg:18px; --r-md:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(33,25,54,.05),0 12px 32px -18px rgba(33,25,54,.28);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance;color:var(--ink);letter-spacing:-.02em}
h1{font-size:clamp(2rem,1.4rem + 2.6vw,3.2rem);font-weight:700}
h2{font-size:clamp(1.45rem,1.2rem + 1vw,1.9rem);font-weight:700}
h3{font-size:1.18rem;font-weight:650}
h4{font-size:1rem;font-weight:650}
p{margin:0}
a{color:var(--roxo-ink)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2.5px solid var(--roxo);outline-offset:2px;border-radius:8px}
input,textarea,select{font:inherit;color:var(--ink)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-2)}
.small{font-size:.88rem}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-lg{display:flex;flex-direction:column;gap:34px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.prose{max-width:66ch}
.label{font-family:var(--f-mono);font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--roxo-ink)}
.label.light{color:var(--agua)}
.dots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.dots li{position:relative;padding-left:20px}
.dots li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--roxo);transform:rotate(45deg)}

/* ---------- Estrutura ---------- */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--night);color:var(--on-night);display:flex;flex-direction:column;padding:22px 14px 16px;gap:4px}
.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 16px;text-decoration:none;color:inherit}
.brand-mark{width:40px;height:40px;flex:none;border-radius:12px;background:var(--agua);display:grid;place-items:center;color:var(--night)}
.brand-title{font-family:var(--f-display);font-weight:700;font-size:1.02rem;line-height:1.15;color:#fff;letter-spacing:-.01em}
.brand-sub{font-size:.75rem;color:var(--on-night-2)}
.prog{margin:2px 8px 10px;padding:12px;border-radius:14px;background:var(--night-2)}
.prog .segs{display:grid;grid-auto-flow:column;gap:4px;margin-top:9px}
.prog .segs i{height:6px;border-radius:3px;background:var(--night-3)}
.prog .segs i.on{background:var(--agua)}
.prog .segs i.part{background:linear-gradient(90deg,var(--lilas) 50%,var(--night-3) 50%)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{padding:12px 10px 6px}
.nav a{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--on-night-2);font-weight:600;font-size:.9rem;line-height:1.25;transition:background .2s,color .2s}
.nav a:hover{background:var(--night-2);color:#fff}
.nav a.active{background:var(--night-3);color:#fff}
.nav a .nn{font-family:var(--f-mono);font-size:.74rem;color:var(--lilas)}
.nav a .st{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--night-3);display:grid;place-items:center}
.nav a .st.part{border-color:var(--lilas)}
.nav a .st.done{background:var(--agua);border-color:var(--agua);color:var(--night)}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--night-3);display:flex;flex-direction:column;gap:2px}
.side-foot a,.side-foot button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--on-night-2);font-size:.86rem;font-weight:600;background:none;border:0;text-align:left;width:100%}
.side-foot a:hover,.side-foot button:hover,.side-foot a.active{background:var(--night-2);color:#fff}
.topbar{display:none}
.scrim{display:none}
main{min-width:0;padding-block:32px 90px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.view{max-width:1080px;margin:0 auto;animation:viewIn .4s ease both}
@keyframes viewIn{from{opacity:.55;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:940px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:60;transform:translateX(-102%);transition:transform .3s ease;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-left:max(14px,env(safe-area-inset-left,0px))}
  .sidebar.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(20,15,35,.45);z-index:55;opacity:0;pointer-events:none;transition:opacity .3s}
  .scrim.open{opacity:1;pointer-events:auto}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--night)}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--night);color:#fff;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar .segs{margin-left:auto;display:flex;gap:3px}
  .topbar .segs i{width:12px;height:5px;border-radius:3px;background:var(--night-3)}
  .topbar .segs i.on{background:var(--agua)}
  main{padding-block:20px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}

/* ---------- Componentes ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;border-radius:12px;padding:11px 18px;font-weight:700;font-size:.95rem;text-decoration:none;line-height:1.2;transition:transform .15s,background .2s,border-color .2s,box-shadow .2s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--agua);color:var(--night)}
.btn-primary:hover{background:#80CFBE;box-shadow:0 8px 20px -12px var(--agua-ink)}
.btn-dark{background:var(--night);color:#fff}
.btn-dark:hover{background:var(--night-2)}
.btn-ghost{background:transparent;border-color:var(--line-2);color:var(--ink)}
.btn-ghost:hover{border-color:var(--roxo);background:var(--surface)}
.btn-soft{background:var(--lilas-soft);color:var(--roxo-ink)}
.btn-soft:hover{background:var(--lilas-mid)}
.btn-light{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
.btn-light:hover{background:rgba(255,255,255,.14)}
.btn-sm{padding:7px 12px;font-size:.86rem;border-radius:10px}
.btn-icon{width:38px;height:38px;padding:0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:600;font-size:.88rem;color:var(--ink);transition:all .18s}
.chip:hover{border-color:var(--roxo)}
.chip.on{background:var(--night);border-color:var(--night);color:#fff}
.chip.agua.on{background:var(--agua);border-color:var(--agua);color:var(--night)}
.chip.coral.on{background:var(--coral);border-color:var(--coral);color:var(--night)}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:7px;padding:3px 8px;font-size:.74rem;font-weight:700;background:var(--lilas-soft);color:var(--roxo-ink)}
.tag.agua{background:var(--agua-soft);color:var(--agua-ink)}
.tag.coral{background:var(--coral-soft);color:var(--coral-ink)}
.tag.amarelo{background:var(--amarelo-soft);color:var(--amarelo-ink)}
.tag.azul{background:var(--azul-soft);color:var(--azul-ink)}
.tag.line{background:transparent;border:1px solid var(--line-2);color:var(--ink-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;min-width:0}
.card.tight{padding:16px}
.card.soft{background:var(--lilas-soft);border-color:transparent}
.lift{transition:transform .2s,box-shadow .2s,border-color .2s}
.lift:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line-2)}
.note{display:flex;gap:11px;align-items:flex-start;border-radius:var(--r-md);padding:13px 15px;background:var(--azul-soft);color:#1E3F60;font-size:.92rem}
.note.lav{background:var(--lilas-soft);color:var(--roxo-ink)}
.note.agua{background:var(--agua-soft);color:#14473D}
.note.amarelo{background:var(--amarelo-soft);color:#5A450A}
.note.coral{background:var(--coral-soft);color:#6B2833}
.note svg{flex:none;margin-top:2px}
.talk{display:flex;gap:12px;align-items:flex-start;padding:15px 17px;border-radius:var(--r-md);background:var(--surface);border:1.5px dashed var(--lilas)}
.talk .ti{width:32px;height:32px;border-radius:10px;background:var(--lilas-soft);color:var(--roxo);display:grid;place-items:center;flex:none}
.talk .tq{font-weight:650;color:var(--ink);margin-top:2px}
.ib{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:none}
.ib.sm{width:36px;height:36px;border-radius:10px}
.i-lilas{background:var(--lilas-soft);color:var(--roxo)}
.i-agua{background:var(--agua-soft);color:var(--agua-ink)}
.i-coral{background:var(--coral-soft);color:var(--coral-ink)}
.i-amarelo{background:var(--amarelo-soft);color:var(--amarelo-ink)}
.i-azul{background:var(--azul-soft);color:var(--azul-ink)}
.i-night{background:var(--night);color:var(--agua)}
.field,.add-row input,textarea.field{width:100%;min-width:0;border:1.5px solid var(--line-2);border-radius:12px;padding:11px 13px;background:var(--surface)}
textarea.field{min-height:96px;resize:vertical;line-height:1.55}
.field:focus,.add-row input:focus{border-color:var(--roxo);outline:none;box-shadow:0 0 0 3px var(--lilas-soft)}
.add-row{display:flex;gap:8px}
.empty{padding:22px;text-align:center;color:var(--ink-2);border:1.5px dashed var(--line-2);border-radius:var(--r-md);font-size:.92rem}
.sec-title{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.sec-title .ln{flex:1;height:1px;background:var(--line)}
input[type=range]{width:100%;accent-color:var(--roxo)}

/* ---------- Início ---------- */
.hero{position:relative;overflow:hidden;border-radius:24px;background:var(--night);color:var(--on-night);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);min-height:400px}
.hero-text{padding:44px 20px 44px 44px;display:flex;flex-direction:column;gap:18px;position:relative;z-index:2}
.title-slot{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px dashed rgba(198,178,232,.6);font-family:var(--f-mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--lilas)}
.hero h1{color:#fff;font-size:clamp(2.3rem,1.5rem + 3.6vw,4rem);line-height:.98;font-weight:750}
.hero h1 em{font-style:normal;color:var(--agua)}
.hero p.sub{font-size:1.08rem;color:var(--on-night-2);max-width:42ch}
.hero-art{position:relative;min-height:300px}
.hero-art svg{position:absolute;inset:0;width:100%;height:100%}
@media (max-width:820px){.hero{grid-template-columns:1fr}.hero-text{padding:30px 22px 6px}.hero-art{min-height:230px}}
.eqbar{transform-box:fill-box;transform-origin:50% 100%;animation:eq 2.6s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.spark{transform-box:fill-box;transform-origin:center;animation:sp 4s ease-in-out infinite}
@keyframes sp{0%,100%{opacity:.9;transform:scale(1) rotate(0)}50%{opacity:.35;transform:scale(.7) rotate(25deg)}}
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.how .hs{padding:16px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.how .hs b{display:block;font-family:var(--f-display);font-size:1.02rem;margin:8px 0 4px}
.how .hs p{font-size:.88rem;color:var(--ink-2)}
@media (max-width:800px){.how{grid-template-columns:1fr 1fr}}
.setlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.track-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;align-items:center;gap:16px;padding:16px 8px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;transition:background .2s;border-radius:12px}
.track-row:hover{background:var(--surface)}
.track-row .num{font-family:var(--f-display);font-weight:700;font-size:2rem;color:transparent;-webkit-text-stroke:1.2px var(--roxo);line-height:1}
.track-row.done .num{color:var(--roxo);-webkit-text-stroke:0}
.track-row h3{font-size:1.15rem}
.track-row .meta{font-size:.86rem;color:var(--ink-2)}
.track-row .dur{font-family:var(--f-mono);font-size:.76rem;color:var(--ink-2)}
@media (max-width:640px){.track-row{grid-template-columns:44px minmax(0,1fr);gap:4px 12px}.track-row .num{font-size:1.5rem;grid-row:span 2}.track-row .dur{display:none}.track-row .stp{grid-column:2;justify-self:start}}
.stp{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.stp.part{border-color:var(--lilas);background:var(--lilas-soft);color:var(--roxo-ink)}
.stp.done{border-color:var(--agua);background:var(--agua-soft);color:var(--agua-ink)}

/* ---------- Ingresso (conclusão) ---------- */
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.ticket{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 92px;background:var(--night);color:var(--on-night);border-radius:16px;overflow:hidden;min-height:130px;
  -webkit-mask:radial-gradient(circle 11px at calc(100% - 92px) 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 11px at calc(100% - 92px) 100%,#0000 98%,#000) bottom/100% 51% no-repeat;
  mask:radial-gradient(circle 11px at calc(100% - 92px) 0,#0000 98%,#000) top/100% 51% no-repeat,radial-gradient(circle 11px at calc(100% - 92px) 100%,#0000 98%,#000) bottom/100% 51% no-repeat}
.ticket .tk-main{padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ticket .tk-main h4{color:#fff;font-size:1.08rem}
.ticket .tk-main p{font-size:.85rem;color:var(--on-night-2);overflow-wrap:anywhere}
.ticket .tk-stub{border-left:2px dashed rgba(198,178,232,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;text-align:center}
.ticket .tk-stub .n{font-family:var(--f-display);font-size:2rem;font-weight:750;color:var(--agua);line-height:1}
.ticket .tk-stub small{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--on-night-2)}
.ticket.off{background:transparent;border:1.5px dashed var(--line-2);color:var(--ink-2);-webkit-mask:none;mask:none}
.ticket.off .tk-main h4{color:var(--ink-2)}
.ticket.off .tk-main p,.ticket.off .tk-stub small{color:var(--ink-2)}
.ticket.off .tk-stub{border-left-color:var(--line-2)}
.ticket.off .tk-stub .n{color:var(--line-2)}
.ticket.big{min-height:170px}
.ticket.big .tk-main h4{font-size:1.4rem}
.stamp{animation:stamp .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stamp{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}

/* ---------- Cabeçalho de missão ---------- */
.mhead{position:relative;overflow:hidden;border-radius:22px;background:var(--night);color:var(--on-night);padding:30px 32px 26px}
.mhead .bignum{position:absolute;right:-6px;top:-34px;font-family:var(--f-display);font-weight:800;font-size:clamp(9rem,6rem + 10vw,15rem);line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(198,178,232,.28);pointer-events:none;letter-spacing:-.06em}
.mhead .wave{position:absolute;left:0;right:0;bottom:0;height:60px;opacity:.5;pointer-events:none}
.mhead h1{color:#fff;margin-top:10px;max-width:16ch}
.mhead .hook{color:var(--on-night-2);font-size:1.06rem;max-width:56ch;margin-top:10px}
.mhead .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;position:relative}
.mhead .meta span{font-size:.8rem;font-weight:600;padding:5px 10px;border-radius:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:var(--on-night)}
.mhead .meta .done{background:var(--agua);color:var(--night);border-color:var(--agua)}
.mhead .tools{position:absolute;top:22px;right:22px;display:flex;gap:8px;z-index:2}
@media (max-width:640px){.mhead{padding:24px 20px 22px}.mhead .tools{position:static;margin-bottom:6px}}
.stepper{display:flex;gap:6px;margin:16px 0 26px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.stepper button{flex:1 0 auto;min-width:120px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 14px 12px;border:0;background:var(--surface);border-radius:12px;border-bottom:3px solid var(--line);text-align:left;transition:all .2s}
.stepper button .sn{font-family:var(--f-mono);font-size:.7rem;color:var(--ink-2);letter-spacing:.08em}
.stepper button .sl{font-weight:700;font-size:.92rem;color:var(--ink-2)}
.stepper button.seen{border-bottom-color:var(--lilas)}
.stepper button.on{border-bottom-color:var(--roxo);background:var(--lilas-soft)}
.stepper button.on .sl{color:var(--ink)}
.stepnav{display:flex;justify-content:space-between;gap:10px;margin-top:28px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.brief{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:18px;align-items:start}
@media (max-width:820px){.brief{grid-template-columns:1fr}}
.brief .lead{font-size:1.14rem;line-height:1.6}
.brief .goal{display:flex;flex-direction:column;gap:12px}
.flow-mini{display:flex;flex-direction:column;gap:10px;counter-reset:fm}
.flow-mini li{list-style:none;display:flex;gap:10px;align-items:flex-start;font-size:.93rem}
.flow-mini li::before{counter-increment:fm;content:counter(fm,decimal-leading-zero);font-family:var(--f-mono);font-size:.74rem;color:var(--roxo-ink);background:var(--lilas-soft);border-radius:6px;padding:2px 6px;margin-top:1px}

/* ---------- Missão 1: bastidores ---------- */
.brain-wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:18px;align-items:start}
@media (max-width:860px){.brain-wrap{grid-template-columns:1fr}}
.brain-stage{border-radius:var(--r-lg);background:var(--night);padding:14px}
.brain-svg{width:100%;height:auto;display:block}
.brain-svg .lobe{cursor:pointer;stroke:var(--night);stroke-width:3;transition:opacity .25s,filter .25s}
.brain-svg .lobe:hover,.brain-svg .lobe:focus{filter:brightness(1.08);outline:none}
.brain-svg.has-sel .lobe:not(.sel){opacity:.35}
.brain-svg .deep{cursor:pointer}
.brain-svg .pulse{animation:pulse 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.3)}}
.brain-svg text{font-family:var(--f-mono);font-size:9.5px;font-weight:600;fill:var(--night);pointer-events:none;letter-spacing:.06em;text-transform:uppercase}
.passes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.pass{perspective:1200px;border:0;background:none;padding:0;text-align:left;min-height:250px}
.pass .inner{position:relative;width:100%;height:100%;min-height:250px;transition:transform .6s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.pass.flip .inner{transform:rotateY(180deg)}
.pass .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.pass .front{background:var(--night);color:var(--on-night)}
.pass .front h3{color:#fff;font-size:1.3rem}
.pass .front .role{font-size:.9rem;color:var(--on-night-2)}
.pass .front .hole{width:42px;height:8px;border-radius:4px;background:var(--bg);align-self:center;margin-bottom:6px}
.pass .back{background:var(--surface);border:1px solid var(--line);transform:rotateY(180deg);font-size:.9rem}
.pass .back b{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--roxo-ink);display:block;margin-bottom:2px}
.crew-pick{display:flex;flex-wrap:wrap;gap:8px}
.crew-pick button{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line-2);background:var(--surface);border-radius:12px;padding:9px 12px;font-weight:650;font-size:.9rem;transition:all .18s}
.crew-pick button.on{background:var(--night);border-color:var(--night);color:#fff}
.crew-pick button.hit{border-color:var(--agua);box-shadow:0 0 0 3px var(--agua-soft)}
.scene{border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);overflow:hidden}
.scene .sc-top{padding:18px 20px;background:var(--lilas-soft);display:flex;gap:14px;align-items:flex-start}
.scene .sc-time{font-family:var(--f-mono);font-weight:700;color:var(--roxo-ink);font-size:.9rem;background:var(--surface);border-radius:8px;padding:4px 8px;flex:none}
.scene .sc-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.timeline{display:flex;gap:6px;flex-wrap:wrap}
.timeline button{font-family:var(--f-mono);font-size:.74rem;padding:5px 9px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2)}
.timeline button.on{background:var(--night);color:#fff;border-color:var(--night)}
.timeline button.done{border-color:var(--agua);color:var(--agua-ink)}
.mixer{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;padding:18px;border-radius:var(--r-lg);background:var(--night)}
@media (max-width:700px){.mixer{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fader{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--on-night)}
.fader .track{position:relative;width:46px;height:150px;border-radius:12px;background:var(--night-2);overflow:hidden}
.fader .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,var(--roxo),var(--lilas));transition:height .2s}
.fader input{writing-mode:vertical-lr;direction:rtl;position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ns-resize;margin:0}
.fader span{font-size:.74rem;font-weight:700;text-align:center;line-height:1.2;color:var(--on-night-2)}

/* ---------- Missão 2: chat ---------- */
.chat-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:900px){.chat-wrap{grid-template-columns:1fr}}
.phone{border-radius:26px;background:var(--surface);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;max-width:560px;width:100%}
.phone-top{display:flex;gap:10px;align-items:center;padding:14px 16px;background:var(--night);color:#fff}
.phone-top .av{width:36px;height:36px;border-radius:12px;background:var(--agua);color:var(--night);display:grid;place-items:center;font-weight:800;font-family:var(--f-display)}
.phone-top small{display:block;color:var(--on-night-2);font-size:.75rem}
.chat{padding:16px;display:flex;flex-direction:column;gap:10px;min-height:340px;max-height:520px;overflow-y:auto;background:linear-gradient(180deg,var(--bg),#fff)}
.msg{max-width:82%;padding:9px 13px;border-radius:16px;font-size:.94rem;line-height:1.45;animation:msgIn .3s ease both;overflow-wrap:anywhere}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.them{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px;align-self:flex-start}
.msg.them b{display:block;font-size:.76rem;margin-bottom:1px}
.msg.me{background:var(--night);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.msg.sys{align-self:center;background:var(--agua-soft);color:var(--agua-ink);font-size:.8rem;font-weight:700;border-radius:999px;padding:5px 12px}
.typing{align-self:flex-start;display:flex;gap:4px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-2);animation:ty 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,100%{opacity:.3}50%{opacity:1}}
.chat-actions{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.chat-actions .opt{text-align:left;border:1.5px solid var(--line-2);background:var(--surface);border-radius:12px;padding:10px 13px;font-size:.92rem;font-weight:600;transition:all .18s}
.chat-actions .opt:hover{border-color:var(--roxo);background:var(--lilas-soft)}
.chat-actions .opt small{display:block;font-weight:500;color:var(--ink-2);font-size:.8rem}
.dossier{display:flex;flex-direction:column;gap:10px}
.file{border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);padding:14px}
.file.locked{background:transparent;border-style:dashed;color:var(--ink-2)}
.file h4{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.file p{font-size:.9rem}
.file .src{font-family:var(--f-mono);font-size:.68rem;color:var(--ink-2);margin-top:8px;letter-spacing:.04em}
.file.new{animation:stamp .6s cubic-bezier(.2,1.4,.4,1) both;border-color:var(--agua)}

/* ---------- Missão 3: cartas ---------- */
.sort-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:760px;margin:0 auto}
.deck-zone{position:relative;height:300px;display:grid;place-items:center;touch-action:none}
.scard{position:absolute;width:min(100%,420px);min-height:230px;border-radius:22px;padding:26px;display:flex;flex-direction:column;justify-content:space-between;gap:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);cursor:grab;user-select:none;touch-action:none}
.scard.dragging{cursor:grabbing;transition:none}
.scard.fly{transition:transform .35s ease,opacity .35s ease}
.scard.under{transform:translateY(10px) scale(.96);opacity:.6;box-shadow:none;cursor:default}
.scard .sit{font-family:var(--f-display);font-size:clamp(1.25rem,1.1rem + .8vw,1.55rem);font-weight:650;line-height:1.25;letter-spacing:-.01em}
.scard.forte{background:var(--night);color:#fff;border-color:var(--night)}
.scard.forte .sit{color:#fff}
.piles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.piles{grid-template-columns:1fr 1fr}}
.pile{border:1.5px solid var(--line-2);background:var(--surface);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:.9rem;transition:all .2s;text-align:center}
.pile .pc{font-family:var(--f-mono);font-size:.74rem;color:var(--ink-2);font-weight:500}
.pile:hover,.pile.hot{border-color:var(--roxo);background:var(--lilas-soft);transform:translateY(-2px)}
.pile .dot{width:12px;height:12px;border-radius:4px}
.board-map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.board-map{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.board-map{grid-template-columns:1fr}}
.bcol{border-radius:var(--r-md);padding:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px;min-height:120px}
.bcol h4{display:flex;align-items:center;gap:8px;font-size:.95rem}
.mcard{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:.88rem;font-weight:600;display:flex;gap:8px;align-items:flex-start;transition:all .18s}
.mcard:hover{border-color:var(--roxo)}
.mcard.star{background:var(--lilas-soft);border-color:var(--roxo)}
.mcard.forte{border-left:4px solid var(--agua)}
.deep{border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);padding:20px}

/* ---------- Missão 4: laboratório ---------- */
.lab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:12px}
.exp{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:8px;transition:all .2s}
.exp:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.exp.on{border-color:var(--night);box-shadow:0 0 0 2px var(--night)}
.exp p{font-size:.86rem;color:var(--ink-2)}
.game-area{margin-top:18px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);padding:22px;min-height:300px}
.game-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px}
.gstatus{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-2)}
.att-grid{display:grid;gap:6px;margin:0 auto;max-width:500px;position:relative}
.att-cell{aspect-ratio:1;border:0;background:var(--bg);border-radius:10px;display:grid;place-items:center;padding:4px;transition:transform .15s,background .2s}
.att-cell:hover{transform:scale(1.06)}
.att-cell.found{background:var(--agua-soft);box-shadow:inset 0 0 0 2px var(--agua-ink)}
.att-cell.nope{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.att-cell svg{width:72%;height:72%}
.distract-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.distract-layer span{position:absolute;animation:drift 5s linear infinite;opacity:.8}
@keyframes drift{from{transform:translate(0,30px) rotate(0)}to{transform:translate(40px,-60px) rotate(30deg);opacity:0}}
.target-pill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:10px;background:var(--lilas-soft);font-weight:700}
.target-pill svg{width:26px;height:26px}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:320px;margin:10px auto}
.pad{aspect-ratio:1;border:0;border-radius:20px;display:grid;place-items:center;transition:transform .12s,filter .12s,box-shadow .12s}
.pad svg{width:44%;height:44%}
.pad.lit{transform:scale(1.05);filter:brightness(1.1);box-shadow:0 0 0 5px #fff,0 0 28px 4px currentColor}
.pad:disabled{opacity:1;cursor:default}
.stage-box{position:relative;height:240px;border-radius:var(--r-md);background:radial-gradient(60% 80% at 50% 0%,var(--night-3),var(--night) 70%);overflow:hidden;display:grid;place-items:center;margin:10px 0 16px}
.stage-box .spot{position:absolute;top:-20px;left:50%;width:260px;height:300px;transform:translateX(-50%);background:radial-gradient(50% 60% at 50% 100%,rgba(242,212,126,.5),transparent 70%);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);opacity:0;transition:opacity .2s}
.stage-box .spot.on{opacity:1}
.stage-box .stim{position:relative;width:110px;height:110px;display:grid;place-items:center;animation:popIn .18s ease both}
@keyframes popIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.stage-box .flash{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#fff;font-weight:700;font-size:.92rem}
.plan-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){.plan-cols{grid-template-columns:1fr}}
.plan-list{display:flex;flex-direction:column;gap:8px;min-height:110px;padding:12px;border-radius:var(--r-md);background:var(--bg);border:1.5px dashed var(--line-2)}
.plan-item{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:.92rem;text-align:left;width:100%}
.plan-item .pn{width:24px;height:24px;border-radius:7px;background:var(--night);color:#fff;display:grid;place-items:center;font-size:.76rem;font-weight:800;flex:none;font-family:var(--f-mono)}
.plan-item .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.mini{border:0;background:var(--bg);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;color:var(--ink)}
.mini:hover{background:var(--lilas-soft)}
.plan-item.warn{border-color:var(--coral);background:var(--coral-soft)}
.flex-table{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.bin{border:1.5px dashed var(--line-2);border-radius:var(--r-md);padding:10px;background:var(--bg);display:flex;flex-direction:column;align-items:center;transition:all .2s}
.bin:hover{border-color:var(--roxo)}
.bin.good{border-color:var(--agua-ink);background:var(--agua-soft)}
.bin.bad{border-color:var(--coral);background:var(--coral-soft)}
.fcard{width:90px;height:116px;border-radius:12px;background:var(--surface);border:2px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;padding:6px}
.fcard svg{width:28px;height:28px}
.fcard.big{width:124px;height:156px}
.fcard.big svg{width:38px;height:38px}
.fcard.rule-cor{border:3px solid var(--amarelo)}
.fcard.rule-forma{border:3px dashed var(--roxo)}
.rule-banner{display:inline-flex;gap:8px;align-items:center;padding:7px 14px;border-radius:10px;background:var(--night);color:#fff;font-weight:700;font-size:.92rem}
.rule-banner.changed{animation:wob .6s}
@keyframes wob{30%{transform:scale(1.06)}60%{transform:scale(.98)}}
.journal{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:var(--r-md);background:var(--bg);border:1px solid var(--line)}

/* ---------- Missão 5: semana ---------- */
.week-scroll{overflow-x:auto;padding-bottom:6px}
.week{display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));gap:8px;min-width:900px}
.day{border-radius:var(--r-md);background:var(--surface);border:1.5px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:6px;min-height:230px;transition:border-color .2s,background .2s}
.day.target{border-color:var(--agua-ink);background:var(--agua-soft);cursor:pointer}
.day.over{border-color:var(--coral)}
.day h4{display:flex;justify-content:space-between;align-items:center;font-size:.92rem}
.energy{display:flex;gap:3px}
.energy i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.energy i.on{background:var(--roxo)}
.energy i.ovr{background:var(--coral)}
.tok{display:flex;gap:6px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 9px;font-size:.82rem;font-weight:650;line-height:1.3;width:100%}
.tok.fixed{background:var(--night);color:#fff;border-color:var(--night);cursor:default}
.tok.sel{outline:2.5px solid var(--roxo);outline-offset:1px}
.tok small{display:block;font-weight:500;color:var(--ink-2);font-size:.72rem;margin-top:1px}
.tok.fixed small{color:var(--on-night-2)}
.tok .sz{margin-left:auto;font-family:var(--f-mono);font-size:.68rem;color:var(--ink-2);flex:none}
.tok-bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:8px}
.tok-bank .tok{background:var(--surface);padding:10px}
.tok.late{border-color:var(--coral);background:var(--coral-soft)}
.story{display:flex;flex-direction:column;gap:10px}
.story .sd{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);animation:msgIn .35s ease both}
.story .sd b{font-family:var(--f-mono);font-size:.8rem;color:var(--roxo-ink)}
.story .sd.warn{border-color:var(--coral);background:var(--coral-soft)}
.story .sd.good{border-color:var(--agua-mid);background:var(--agua-soft)}

/* ---------- Missão 6: emoções ---------- */
.emo-top{display:flex;gap:8px;flex-wrap:wrap}
.thermo{display:flex;flex-direction:column;gap:8px}
.thermo input[type=range]{-webkit-appearance:none;appearance:none;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--azul),var(--amarelo) 55%,var(--coral));outline:none}
.thermo input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--night);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer}
.thermo input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--night);border:3px solid #fff;cursor:pointer}
.thermo .tv{font-family:var(--f-display);font-weight:750;font-size:2.4rem;line-height:1;color:var(--ink)}
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.path{text-align:left;border:1.5px solid var(--line-2);background:var(--surface);border-radius:14px;padding:14px;font-weight:650;display:flex;flex-direction:column;gap:8px;transition:all .2s}
.path:hover{border-color:var(--roxo)}
.path.on{border-color:var(--night);box-shadow:0 0 0 2px var(--night)}
.path.seen{background:var(--bg)}
.path .seenmark{font-family:var(--f-mono);font-size:.68rem;color:var(--agua-ink);letter-spacing:.08em;text-transform:uppercase}
.conseq{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;animation:msgIn .35s ease both}
@media (max-width:760px){.conseq{grid-template-columns:1fr}}
.conseq .cq{border-radius:12px;padding:14px;font-size:.92rem}
.conseq .cq b{display:block;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.cq.a{background:var(--amarelo-soft);color:#4E3C08}
.cq.b{background:var(--azul-soft);color:#1E3F60}
.cq.c{background:var(--lilas-soft);color:var(--roxo-ink)}
.sit-tabs{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Missão 7: estratégias ---------- */
.chal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px}
.chal{text-align:left;border:1.5px solid var(--line-2);background:var(--surface);border-radius:14px;padding:14px;font-weight:650;transition:all .18s}
.chal:hover{border-color:var(--roxo)}
.chal.on{background:var(--night);border-color:var(--night);color:#fff}
.tool-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.tool{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:10px}
.tool.inbag{border-color:var(--agua-ink);box-shadow:0 0 0 2px var(--agua-soft)}
.tool p{font-size:.9rem}
.tool details summary{cursor:pointer;font-weight:700;font-size:.88rem;color:var(--roxo-ink)}
.tool ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.bag{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--night);color:#fff;position:sticky;top:12px;z-index:5}
.bag .tag{background:var(--night-3);color:#fff}
.expcard{border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:10px}
.expcard dl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;margin:0;font-size:.92rem}
.expcard dt{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--roxo-ink);padding-top:3px}
.expcard dd{margin:0;overflow-wrap:anywhere}
@media (max-width:560px){.expcard dl{grid-template-columns:1fr}}
.res-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

  intro: "Este material reúne informações sobre o TDAH na adolescência e algumas possibilidades de manejo no cotidiano. Ele não pretende dizer como uma família deve funcionar: cada família tem sua história, seus valores e seus recursos, e cada adolescente vivencia o TDAH de um jeito. A ideia é ampliar a compreensão e abrir conversas, inclusive com os profissionais que acompanham sua filha.",
  secoes: [
    { id: "f-oque", titulo: "O que é o TDAH", html: `<p>O Transtorno do Déficit de Atenção e Hiperatividade é um transtorno do neurodesenvolvimento, caracterizado por um padrão persistente de desatenção e/ou hiperatividade-impulsividade, presente em mais de um contexto e com impacto no funcionamento. Estima-se que atinja cerca de 5% das crianças e adolescentes.</p><p>Há forte influência genética e diferenças, em média, no funcionamento de redes cerebrais ligadas às funções executivas, à motivação e à recompensa, com participação dos sistemas de dopamina e noradrenalina. O diagnóstico é clínico e não se baseia em exames isolados. O TDAH não é resultado de falta de esforço, de inteligência ou de educação inadequada.</p>` },
    { id: "f-adol", titulo: "Como pode aparecer na adolescência", html: `<p>A adolescência traz mais matérias, mais professores, prazos mais longos, mais vida social e mais expectativa de autonomia, enquanto as funções executivas ainda estão em pleno desenvolvimento. Nesse cenário, é comum que a agitação visível diminua e ganhem destaque a desatenção, a desorganização, a dificuldade com prazos e a intensidade emocional.</p><p>Em meninas, os sinais podem ser mais discretos: menos agitação e mais inquietação interna, distração e esforço para compensar. Esse esforço nem sempre aparece para quem está de fora, mas pode gerar cansaço, ansiedade e autocrítica.</p>` },
    { id: "f-fe", titulo: "Funções executivas no cotidiano", html: `<p>Funções executivas são as habilidades que permitem planejar, organizar, iniciar e concluir tarefas, manter informações na mente, frear impulsos e ajustar emoções e comportamentos aos objetivos. No TDAH, elas costumam precisar de mais apoio externo, e por mais tempo, do que em outros adolescentes da mesma idade.</p><p>Em casa, isso pode aparecer como esquecer combinados, perder objetos, subestimar o tempo das tarefas, começar várias coisas sem terminar ou se perder em instruções longas. Muitas vezes, a adolescente sabe o que precisa fazer; a dificuldade está em fazer no momento certo. Essa diferença entre saber e executar ajuda a entender por que lembretes e estruturas externas tendem a funcionar melhor do que repetir a orientação.</p>` },

let AC = null;
function tone(freq = 440, dur = 0.25, type = "sine", vol = 0.16, when = 0) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume();
    const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
const chime = () => { tone(523, 0.3, "sine", 0.14); tone(659, 0.3, "sine", 0.14, 0.1); tone(784, 0.45, "sine", 0.14, 0.2); };

function wave(color = "#91D8C9", seed = 1) {
  let d = "M0 40"; for (let x = 0; x <= 1200; x += 12) { const y = 40 + Math.sin(x / (60 + seed * 7)) * 12 * Math.sin(x / 300 + seed) + Math.sin(x / 23) * 3; d += ` L${x} ${y.toFixed(1)}`; }

const MREND = {}, MMOUNT = {}, MSUM = {};
let CUR = null;
function missionView(id) {
  return {
    render() {
      CUR = id; const m = missionOf(id); const st = M(id); save();
      return `<header class="mhead"><span class="bignum" aria-hidden="true">${pad2(m.n)}</span>${wave("#91D8C9", m.n)}
        <div class="tools no-print"><button class="btn btn-light btn-sm" data-act="mediacao">${icon("clipboard", 16)} Notas para a mediação</button></div>
        <span class="label light">Missão ${pad2(m.n)} de ${pad2(MISSIONS.length)} · ${m.tema}</span>

      </header>
      <nav class="stepper no-print" id="stepper" aria-label="Etapas da missão"></nav>
      <section id="mstep"></section>
      <div class="stepnav no-print" id="stepnav"></div>`;
    },

  };
}
function renderStep() {
  const id = CUR; const m = missionOf(id); const st = M(id); const last = m.steps.length - 1;
  st.step = Math.max(0, Math.min(last, st.step || 0)); st.seen[st.step] = true; save();
  $("#stepper").innerHTML = m.steps.map((s, i) => `<button class="${i === st.step ? "on" : ""} ${st.seen[i] ? "seen" : ""}" data-act="goStep" data-i="${i}" aria-current="${i === st.step}"><span class="sn">${pad2(i + 1)}</span><span class="sl">${s}</span></button>`).join("");
  let html;
  if (st.step === 0) html = briefHTML(m);
  else if (st.step === last) html = closingHTML(m);
  else html = MREND[id][st.step - 1]();
  $("#mstep").innerHTML = `<div style="animation:viewIn .35s ease both">${html}</div>`;
  const mt = MMOUNT[id] && MMOUNT[id][st.step]; mt && mt();
  $("#stepnav").innerHTML = `${st.step > 0 ? `<button class="btn btn-ghost" data-act="stepBy" data-d="-1">${icon("arrowL", 16)} ${m.steps[st.step - 1]}</button>` : `<a class="btn btn-ghost" href="#inicio">${icon("arrowL", 16)} Setlist</a>`}
    ${st.step < last ? `<button class="btn btn-dark" data-act="stepBy" data-d="1">${m.steps[st.step + 1]} ${icon("arrowR", 16)}</button>` : ""}`;
  updateNav();
}

A.goStep = (el) => { stopAllGames(); M(CUR).step = +el.dataset.i; renderStep(); };

function briefHTML(m) {

}

      <p class="small muted">${d.sel ? `<b style="color:var(--roxo-ink)">Tarefa selecionada.</b> Agora toque no dia em que quer fazê-la${d.place[d.sel] !== undefined ? `, ou <button class="btn btn-ghost btn-sm" data-act="wkUnplace">devolva para a lista</button>` : ""}.` : "Toque em uma tarefa para selecioná-la."} Cada ■ ocupa um bloco de energia.</p></div>
    <div class="week-scroll"><div class="week">${M5.dias.map((n, i) => { const it = dayItems(i); const over = it.load > M5.cap; return `<div class="day ${d.sel ? "target" : ""} ${over ? "over" : ""}" data-act="wkDay" data-i="${i}" role="button" aria-label="${n}: ${it.load} de ${M5.cap} blocos"><h4>${n}<span class="energy">${Array.from({ length: Math.max(M5.cap, it.load) }, (_, k) => `<i class="${k < it.load ? (k >= M5.cap ? "ovr" : "on") : ""}"></i>`).join("")}</span></h4>

function simulate() {
  const d = WD(); const lines = []; const tally = { antes: 0, vespera: 0, depois: 0, fora: 0, pesados: 0 };
  M5.dias.forEach((n, i) => {
    const it = dayItems(i); const parts = []; let kind = "";
    it.fixed.forEach((f) => parts.push(f.t + (f.id === "x1" && d.twist ? " (remarcado)" : "") + "."));
    it.tasks.forEach((t) => {
      if (t.tipo === "descanso") { parts.push("Teve um tempo para recarregar."); kind = kind || "good"; return; }
      if (t.ate === null) { parts.push(t.t + ", sem pressa."); return; }
      if (i > t.ate) { parts.push(`${t.t} ficou para depois do prazo (${t.rot.toLowerCase()}).`); tally.depois++; kind = "warn"; }
      else if (i === t.ate) { parts.push(`${t.t} aconteceu no limite do prazo.`); tally.vespera++; }
      else { parts.push(`${t.t} foi feito com folga.`); tally.antes++; }
    });
    if (it.load > M5.cap) { parts.push("Dia acima da energia: é provável chegar cansada ao fim, e algo pode sair pela metade."); tally.pesados++; kind = "warn"; }
    if (i === 3) parts.push("Prova de Matemática de manhã.");
    if (i === 4) parts.push("Entrega do trabalho de História.");
    if (!parts.length) parts.push("Um dia mais livre.");
    lines.push({ n, t: parts.join(" "), kind });
  });
  M5.tarefas.forEach((t) => { if (d.place[t.id] === undefined && t.tipo !== "livre") tally.fora++; });
  const descanso = d.place.t7 !== undefined;
  return { lines, tally, descanso, fora: M5.tarefas.filter((t) => d.place[t.id] === undefined) };
}
