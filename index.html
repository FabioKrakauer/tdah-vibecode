<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seu mundo, seu ritmo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Jornada interativa de psicoeducação para adolescentes: atenção, organização e emoções.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Manrope:wght@400..800&family=Caveat:wght@500;700&display=swap">
</head><body>
<style>
/* Layout: cabeçalho fixo com cores e tema; mapa da jornada em trilha; cada missão em 4 etapas (Entenda → Experimente → Conecte → Conquista); capítulo final em papel de diário. */
:root{
  /* Paleta padrão: lavanda + sálvia (claro) */
  --bg:#FAF8F4; --surface:#FFFFFF; --surface-2:#F2EFE9; --ink:#25212F; --ink-2:#5F5969; --line:#E5E0D7; --line-2:#D5CEC3;
  --pri:#6E5A9A; --pri-ink:#4E3F75; --pri-soft:#ECE7F5; --on-pri:#FFFFFF;
  --acc:#7E9A7A; --acc-ink:#46613F; --acc-soft:#E2EADD;
  --warm:#D49A86; --warm-ink:#8A4836; --warm-soft:#F6E5DD;
  --gold:#B8924A; --gold-soft:#F3EAD6;
  --hero:#3B3254; --on-hero:#F5F1FB; --on-hero-2:#C9C0DD;
  --paper:#FFFDF8; --rule:#E9E2F0;
  --shadow:0 1px 2px rgba(40,30,60,.06),0 14px 34px -20px rgba(40,30,60,.35);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,sans-serif;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --r-lg:18px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#18161E; --surface:#221F2A; --surface-2:#2A2634; --ink:#ECE8F2; --ink-2:#ABA4B8; --line:#35303F; --line-2:#463F52;
  --pri:#B6A6DD; --pri-ink:#D2C7EE; --pri-soft:#2F2843; --on-pri:#1B1726;
  --acc:#A3BC9E; --acc-ink:#C0D5BB; --acc-soft:#25302A;
  --warm:#E0AE9C; --warm-ink:#EFC6B7; --warm-soft:#3A2B27;
  --gold:#D9B76F; --gold-soft:#3A3122;
  --hero:#2A2340; --on-hero:#F2EEF9; --on-hero-2:#B9AFD0;
  --paper:#24212C; --rule:#332E3E; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#18161E; --surface:#221F2A; --surface-2:#2A2634; --ink:#ECE8F2; --ink-2:#ABA4B8; --line:#35303F; --line-2:#463F52;
  --pri:#B6A6DD; --pri-ink:#D2C7EE; --pri-soft:#2F2843; --on-pri:#1B1726;
  --acc:#A3BC9E; --acc-ink:#C0D5BB; --acc-soft:#25302A;
  --warm:#E0AE9C; --warm-ink:#EFC6B7; --warm-soft:#3A2B27;
  --gold:#D9B76F; --gold-soft:#3A3122;
  --hero:#2A2340; --on-hero:#F2EEF9; --on-hero-2:#B9AFD0;
  --paper:#24212C; --rule:#332E3E; color-scheme:dark;
}
/* Paleta: pastel quente */
:root[data-palette="quente"]{
  --bg:#FBF6EF; --surface:#FFFDF9; --surface-2:#F4ECE1; --ink:#2C221E; --ink-2:#6B5C54; --line:#EADFD2; --line-2:#DCCDBD;
  --pri:#C0705A; --pri-ink:#8E4C38; --pri-soft:#F8E4DA; --on-pri:#FFFFFF;
  --acc:#3F6B73; --acc-ink:#2C4F56; --acc-soft:#DFEAEA;
  --warm:#C98A9A; --warm-ink:#874859; --warm-soft:#F6E3E7;
  --gold:#C49A45; --gold-soft:#F6EBD3;
  --hero:#4A3530; --on-hero:#FCF1E9; --on-hero-2:#E2C9BC;
  --paper:#FFFCF6; --rule:#F0E2D5;
}
@media (prefers-color-scheme: dark){ :root[data-palette="quente"]:not([data-theme="light"]){
  --bg:#1D1816; --surface:#27201D; --surface-2:#302723; --ink:#F3EAE2; --ink-2:#BBAAA0; --line:#3D322D; --line-2:#4C3F39;
  --pri:#E3A189; --pri-ink:#F0BFAC; --pri-soft:#3D2A23; --on-pri:#251916;
  --acc:#8DB3B9; --acc-ink:#B2CED2; --acc-soft:#21302F;
  --warm:#DDA3B1; --warm-ink:#EEC3CD; --warm-soft:#3A2A2E;
  --gold:#E2C07A; --gold-soft:#3A3021;
  --hero:#2E2220; --on-hero:#FBEFE7; --on-hero-2:#D4BCAF;
  --paper:#26201D; --rule:#3A2F2A; color-scheme:dark;
}}
:root[data-palette="quente"][data-theme="dark"]{
  --bg:#1D1816; --surface:#27201D; --surface-2:#302723; --ink:#F3EAE2; --ink-2:#BBAAA0; --line:#3D322D; --line-2:#4C3F39;
  --pri:#E3A189; --pri-ink:#F0BFAC; --pri-soft:#3D2A23; --on-pri:#251916;
  --acc:#8DB3B9; --acc-ink:#B2CED2; --acc-soft:#21302F;
  --warm:#DDA3B1; --warm-ink:#EEC3CD; --warm-soft:#3A2A2E;
  --gold:#E2C07A; --gold-soft:#3A3021;
  --hero:#2E2220; --on-hero:#FBEFE7; --on-hero-2:#D4BCAF;
  --paper:#26201D; --rule:#3A2F2A; color-scheme:dark;
}
/* Paleta: noite estrelada */
:root[data-palette="noite"]{
  --bg:#F3F4FA; --surface:#FFFFFF; --surface-2:#E9EBF5; --ink:#1B1F3A; --ink-2:#565B7A; --line:#DDE0EE; --line-2:#CACFE3;
  --pri:#5A4FA8; --pri-ink:#3F3680; --pri-soft:#E9E7F8; --on-pri:#FFFFFF;
  --acc:#4F86AD; --acc-ink:#346385; --acc-soft:#E1EDF6;
  --warm:#C493B6; --warm-ink:#7D4A70; --warm-soft:#F3E6F0;
  --gold:#B8963F; --gold-soft:#F4EDD8;
  --hero:#1B1F3A; --on-hero:#EEF0FA; --on-hero-2:#AEB3D2;
  --paper:#FDFDFF; --rule:#E4E6F3;
}
@media (prefers-color-scheme: dark){ :root[data-palette="noite"]:not([data-theme="light"]){
  --bg:#11142A; --surface:#1A1E3A; --surface-2:#222748; --ink:#EEF0FA; --ink-2:#A8ADC8; --line:#2D3359; --line-2:#3A416B;
  --pri:#B9A6E8; --pri-ink:#D6CBF4; --pri-soft:#2A2852; --on-pri:#151833;
  --acc:#A8C6E0; --acc-ink:#C8DCEE; --acc-soft:#1E2D46;
  --warm:#E3B7CF; --warm-ink:#F0D0E1; --warm-soft:#382944;
  --gold:#E6C77A; --gold-soft:#36301F;
  --hero:#0C0F22; --on-hero:#EEF0FA; --on-hero-2:#A9AECB;
  --paper:#181C36; --rule:#272C4D; color-scheme:dark;
}}
:root[data-palette="noite"][data-theme="dark"]{
  --bg:#11142A; --surface:#1A1E3A; --surface-2:#222748; --ink:#EEF0FA; --ink-2:#A8ADC8; --line:#2D3359; --line-2:#3A416B;
  --pri:#B9A6E8; --pri-ink:#D6CBF4; --pri-soft:#2A2852; --on-pri:#151833;
  --acc:#A8C6E0; --acc-ink:#C8DCEE; --acc-soft:#1E2D46;
  --warm:#E3B7CF; --warm-ink:#F0D0E1; --warm-soft:#382944;
  --gold:#E6C77A; --gold-soft:#36301F;
  --hero:#0C0F22; --on-hero:#EEF0FA; --on-hero-2:#A9AECB;
  --paper:#181C36; --rule:#272C4D; color-scheme:dark;
}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.015em;color:var(--ink)}
h1{font-size:clamp(1.9rem,1.4rem + 2.2vw,2.9rem);font-weight:750}
h2{font-size:clamp(1.35rem,1.15rem + .9vw,1.75rem);font-weight:700}
h3{font-size:1.14rem;font-weight:680}
h4{font-size:1rem;font-weight:680}
p{margin:0}
a{color:var(--pri-ink)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2.5px solid var(--pri);outline-offset:2px;border-radius:8px}
input,textarea,select{font:inherit;color:var(--ink)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-2)}
.small{font-size:.88rem}
.prose{max-width:64ch}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.stack-lg{display:flex;flex-direction:column;gap:36px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.label{font-size:.74rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:var(--pri-ink)}
.label.acc{color:var(--acc-ink)}
.label.on-hero{color:var(--on-hero-2)}

/* ---------- Estrutura ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand-mark{width:36px;height:36px;border-radius:11px;background:var(--hero);display:grid;place-items:center;flex:none}
.brand-t{font-family:var(--f-display);font-weight:750;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-act{margin-left:auto;display:flex;align-items:center;gap:6px}
.tbtn{display:inline-flex;align-items:center;gap:6px;height:38px;min-width:38px;justify-content:center;padding:0 10px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:650;font-size:.86rem;transition:border-color .2s,background .2s}
.tbtn:hover{border-color:var(--pri)}
.prog-pill{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 10px;border-radius:11px;background:var(--pri-soft);color:var(--pri-ink);font-weight:750;font-size:.84rem;font-variant-numeric:tabular-nums}
.palpop{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(100% + 8px);width:min(300px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:8px;z-index:50;animation:pop .2s ease both}
[hidden]{display:none!important}
.palopt{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;width:100%}
.palopt.on{border-color:var(--pri);background:var(--pri-soft)}
.palopt .sw{display:flex;flex:none}
.palopt .sw i{width:16px;height:28px;display:block}
.palopt .sw i:first-child{border-radius:6px 0 0 6px}.palopt .sw i:last-child{border-radius:0 6px 6px 0}
.palopt b{display:block;font-size:.92rem}
.palopt small{color:var(--ink-2);font-size:.78rem}
@media (max-width:560px){.brand-t{display:none}.tlbl{display:none}}
.wrap{max-width:1100px;margin:0 auto;padding-block:26px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{animation:viewIn .45s ease both}
@keyframes viewIn{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.foot{border-top:1px solid var(--line);margin-top:50px;padding-top:18px;display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:space-between;color:var(--ink-2);font-size:.86rem}

/* ---------- Componentes ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;border-radius:12px;padding:11px 18px;font-weight:720;font-size:.95rem;text-decoration:none;line-height:1.2;transition:transform .15s,background .2s,border-color .2s,box-shadow .2s;text-align:center}
.btn:active{transform:translateY(1px)}
.btn-pri{background:var(--pri);color:var(--on-pri)}
.btn-pri:hover{box-shadow:0 10px 22px -14px var(--pri)}
.btn-ghost{background:transparent;border-color:var(--line-2);color:var(--ink)}
.btn-ghost:hover{border-color:var(--pri)}
.btn-soft{background:var(--pri-soft);color:var(--pri-ink)}
.btn-acc{background:var(--acc-soft);color:var(--acc-ink)}
.btn-hero{background:var(--on-hero);color:var(--hero)}
.btn-hero-ghost{background:transparent;border-color:color-mix(in srgb,var(--on-hero) 35%,transparent);color:var(--on-hero)}
.btn-sm{padding:7px 12px;font-size:.86rem;border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:650;font-size:.88rem;color:var(--ink);transition:all .18s;text-align:left}
.chip:hover{border-color:var(--pri)}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.chip.acc.on{background:var(--acc-ink);border-color:var(--acc-ink);color:var(--surface)}
.chip.warm.on{background:var(--warm-ink);border-color:var(--warm-ink);color:var(--surface)}
.chip.sug{border-style:dashed}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:3px 9px;font-size:.76rem;font-weight:750;background:var(--pri-soft);color:var(--pri-ink)}
.tag.acc{background:var(--acc-soft);color:var(--acc-ink)}
.tag.warm{background:var(--warm-soft);color:var(--warm-ink)}
.tag.gold{background:var(--gold-soft);color:var(--ink)}
.tag.line{background:transparent;border:1px solid var(--line-2);color:var(--ink-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;min-width:0}
.card.soft{background:var(--pri-soft);border-color:transparent}
.card.acc{background:var(--acc-soft);border-color:transparent}
.note{display:flex;gap:11px;align-items:flex-start;border-radius:var(--r-md);padding:13px 15px;background:var(--pri-soft);color:var(--ink);font-size:.94rem}
.note.acc{background:var(--acc-soft)}
.note.warm{background:var(--warm-soft)}
.note.gold{background:var(--gold-soft)}
.note > svg{flex:none;margin-top:2px;color:var(--pri-ink)}
.note.acc > svg{color:var(--acc-ink)}.note.warm > svg{color:var(--warm-ink)}
.talk{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-md);background:var(--surface);border:1.5px dashed var(--line-2)}
.talk .ti{width:32px;height:32px;border-radius:10px;background:var(--acc-soft);color:var(--acc-ink);display:grid;place-items:center;flex:none}
.talk .tq{font-weight:650;margin-top:2px}
.field{width:100%;min-width:0;border:1.5px solid var(--line-2);border-radius:12px;padding:10px 13px;background:var(--surface);color:var(--ink)}
textarea.field{min-height:92px;resize:vertical;line-height:1.55}
.field:focus{border-color:var(--pri);outline:none;box-shadow:0 0 0 3px var(--pri-soft)}
.add-row{display:flex;gap:8px}
.add-row .field{flex:1}
.empty{padding:18px;text-align:center;color:var(--ink-2);border:1.5px dashed var(--line-2);border-radius:var(--r-md);font-size:.92rem}
.mini{border:0;background:var(--surface-2);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;color:var(--ink)}
.mini:hover{background:var(--pri-soft)}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .4s}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-h .ln{flex:1;height:1px;background:var(--line);min-width:30px}
input[type=range]{width:100%;accent-color:var(--pri)}
.f-pri{fill:var(--pri)}.f-acc{fill:var(--acc)}.f-warm{fill:var(--warm)}.f-gold{fill:var(--gold)}.f-hero{fill:var(--hero)}.f-onhero{fill:var(--on-hero)}.f-surface{fill:var(--surface)}.f-soft{fill:var(--pri-soft)}.f-ink{fill:var(--ink)}
.s-onhero{stroke:var(--on-hero)}.s-gold{stroke:var(--gold)}.s-acc{stroke:var(--acc)}.s-pri{stroke:var(--pri)}.s-line{stroke:var(--line-2)}
.twinkle{transform-box:fill-box;transform-origin:center;animation:tw 4.5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72) rotate(18deg)}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ---------- Início ---------- */
.hero{position:relative;overflow:hidden;border-radius:26px;background:var(--hero);color:var(--on-hero);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);min-height:360px}
.hero-text{padding:42px 16px 40px 42px;display:flex;flex-direction:column;gap:16px;position:relative;z-index:2}
.hero h1{color:var(--on-hero);font-size:clamp(2.2rem,1.5rem + 3.2vw,3.7rem);line-height:1}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero .sub{color:var(--on-hero-2);font-size:1.06rem;max-width:44ch}
.hero-art{position:relative;min-height:260px}
.hero-art svg{position:absolute;inset:0;width:100%;height:100%}
@media (max-width:820px){.hero{grid-template-columns:1fr}.hero-text{padding:28px 22px 4px}.hero-art{min-height:210px}}
.trail{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:8px}
.trail-line{position:absolute;left:0;right:0;top:44px;height:60px;pointer-events:none}
.station{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px;text-align:left;text-decoration:none;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:16px;min-width:0;transition:transform .2s,box-shadow .2s,border-color .2s}
.station:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.station .node{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line-2);position:relative}
.station .node svg{width:36px;height:36px}
.station.open .node{border-color:var(--pri);box-shadow:0 0 0 6px var(--pri-soft)}
.station.open .node::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--pri);opacity:.5;animation:ring 2.4s ease-out infinite}
@keyframes ring{from{transform:scale(.85);opacity:.6}to{transform:scale(1.25);opacity:0}}
.station.part .node{border-color:var(--pri);background:conic-gradient(var(--pri-soft) 0 50%,var(--surface) 50% 100%)}
.station.done .node{background:var(--acc-soft);border-color:var(--acc)}
.station.locked{background:transparent;border-style:dashed;color:var(--ink-2)}
.station.locked .node{opacity:.55}
.station .kicker{font-size:.74rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.station h3{font-size:1.08rem}
.station p{font-size:.88rem;color:var(--ink-2)}
.st-pill{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:750;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);margin-top:auto}
.st-pill.open{border-color:var(--pri);background:var(--pri-soft);color:var(--pri-ink)}
.st-pill.part{border-color:var(--gold);background:var(--gold-soft);color:var(--ink)}
.st-pill.done{border-color:var(--acc);background:var(--acc-soft);color:var(--acc-ink)}
@media (max-width:880px){.trail{grid-template-columns:1fr;gap:12px;padding-left:22px}.trail-line{display:none}.trail::before{content:"";position:absolute;left:8px;top:20px;bottom:20px;border-left:2px dashed var(--line-2)}.station{flex-direction:row;flex-wrap:wrap;align-items:center}.station .node{width:52px;height:52px}.station .node svg{width:28px;height:28px}.station .st-body{flex:1;min-width:0}.station .st-pill{margin-top:0}}
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}

function starPts(cx, cy, R, r, n = 5) { const p = []; for (let i = 0; i < n * 2; i++) { const a = ((-90 + (i * 180) / n) * Math.PI) / 180; const rad = i % 2 ? r : R; p.push((cx + rad * Math.cos(a)).toFixed(1) + "," + (cy + rad * Math.sin(a)).toFixed(1)); } return p.join(" "); }

}

function groundHTML() { const i = D("emocoes").gi || 0; if (i >= GROUND.length) return `<div class="card stack" style="text-align:center;align-items:center"><span class="label">5 · 4 · 3 · 2 · 1</span><h3>Você voltou para o agora.</h3><p class="muted">Repare se a cabeça está um pouco mais calma do que antes.</p><button class="btn btn-ghost btn-sm" data-act="tryIt" data-k="ground">${icon("refresh", 14)} Fazer de novo</button></div>`; const [n, t] = GROUND[i]; return `<div class="card stack" style="text-align:center;align-items:center"><span class="label">5 · 4 · 3 · 2 · 1</span><span style="font-family:var(--f-display);font-size:4rem;font-weight:800;line-height:1;color:var(--pri)">${n}</span><p style="font-size:1.15rem;font-weight:700">Encontre ${n} ${t}.</p><p class="small muted">Sem pressa. Pode falar em voz alta ou só pensar.</p><button class="btn btn-pri" data-act="gNext">${i < 4 ? "Próximo" : "Terminar"} ${icon("arrowR", 16)}</button></div>`; }
A.gNext = () => { const d = D("emocoes"); d.gi = (d.gi || 0) + 1; save(); $("#tryit").innerHTML = groundHTML(); };
const DETQ = [["pens", "Qual é o pensamento?", "ex.: todo mundo riu de mim"], ["fato", "Isso é um fato ou uma interpretação? Que provas eu tenho?", ""], ["outra", "Que outra explicação poderia existir?", ""], ["amiga", "O que eu diria para uma amiga que pensasse isso?", ""], ["justo", "Um pensamento mais justo seria...", ""]];
function detHTML() { const det = D("emocoes").det || {}; return `<div class="card stack"><span class="label">Detetive do pensamento</span><p class="muted small">Pense numa situação real ou em uma das histórias. Responda só o que fizer sentido.</p>${DETQ.map(([k, q, ph]) => `<div class="stack-sm"><label for="det-${k}" style="font-weight:700">${q}</label><textarea id="det-${k}" class="field" style="min-height:60px" data-input="det" data-k="${k}" placeholder="${ph}" maxlength="300">${esc(det[k] || "")}</textarea></div>`).join("")}</div>`; }
INPUTS.det = (el) => { const d = D("emocoes"); d.det = d.det || {}; d.det[el.dataset.k] = el.value; save(); };
function m3Quero() { const q = D("emocoes").quero || []; return q.length ? `<div class="card acc stack-sm"><span class="label acc">Estratégias que você quer testar</span><div class="chips">${q.map((x) => `<span class="tag acc">${esc(x)}</span>`).join("")}</div></div>` : ""; }

/* =========================================================
   CAPÍTULO FINAL — MEU CAMINHO DAQUI PRA FRENTE
   ========================================================= */
const F = () => S.fin;
function finSugTools() {
  const s = []; const a = S.m.acao && S.m.acao.d; const e = S.m.emocoes && S.m.emocoes.d;
  ((a && a.pick) || []).forEach((x) => s.push(x)); ((e && e.quero) || []).forEach((x) => s.push(x));
  if (a && a.t) M2.tools.forEach((x) => { if (a.t.tried[x.id]) s.push(x.nome); });
  return [...new Set(s)].filter((x) => !F().tools.some((t) => t.t === x));
}
const FIN_R = [
  () => { const prev = MISSIONS.map((m) => [m, S.m[m.id] && S.m[m.id].d.refl]).filter(([, r]) => r && r.trim());
    return `<h2>Olhando o caminho</h2><p class="hand">Antes de pensar no que vem, vale olhar para trás com calma.</p>
    ${prev.length ? `<div class="card stack-sm" style="background:var(--surface)"><span class="label">O que você deixou pelo caminho</span>${prev.map(([m, r]) => `<p><b>${m.titulo}:</b> <span style="font-family:var(--f-hand);font-size:1.3rem">${esc(r)}</span></p>`).join("")}</div>` : ""}
    <div class="note gold small">${icon("info", 18)}<span>Pode responder “não sei”, pode deixar em branco. Todas as respostas cabem aqui, inclusive as que não são tão boas.</span></div>
    ${FIM.perguntas.map((q) => `<div class="stack-sm"><label for="fq-${q.id}" style="font-weight:700">${q.t}</label><textarea id="fq-${q.id}" class="field" data-input="finQ" data-k="${q.id}" maxlength="800">${esc(F().q[q.id] || "")}</textarea></div>`).join("")}`; },
  () => `<h2>Três cartões</h2><p class="hand">Três lugares para guardar o que ficou de mais importante.</p><div class="trio">${FIM.cartoes.map((c) => `<div class="tcardx ${c.cls}"><h3>${c.t}</h3><label for="fc-${c.id}" class="small">${c.q}</label><textarea id="fc-${c.id}" class="field" data-input="finC" data-k="${c.id}" maxlength="400" style="min-height:130px">${esc(F().cards[c.id] || "")}</textarea></div>`).join("")}</div>`,
  () => { const sug = finSugTools(); return `<h2>Minha caixa de ferramentas</h2><p class="hand">O que eu levo comigo para os dias difíceis e para os dias comuns.</p>
    ${sug.length ? `<div class="stack-sm"><span class="label">Sugestões das suas missões</span><div class="chips">${sug.map((x) => `<button class="chip sug" data-act="finToolAdd" data-v="${esc(x)}">${icon("plus", 13)} ${esc(x)}</button>`).join("")}</div></div>` : ""}
    <form class="add-row" data-form="finTool"><label class="sr-only" for="ft-in">Nova ferramenta</label><input id="ft-in" class="field" placeholder="Outra ferramenta, pessoa, música, lugar..." maxlength="80" autocomplete="off"><button class="btn btn-pri" type="submit">${icon("plus", 16)} Guardar</button></form>
    <div class="tbx"><div class="row" style="gap:10px"><span style="color:var(--gold)">${icon("toolbox", 24)}</span><b style="font-family:var(--f-display);font-size:1.1rem">Minha caixa</b></div>${F().tools.length ? F().tools.map((t, k) => `<div class="tbx-item"><b>${esc(t.t)}</b><button class="mini" data-act="finToolDel" data-k="${k}" aria-label="Tirar da caixa">${icon("x", 14)}</button><label class="sr-only" for="ftq-${k}">Quando usar</label><input id="ftq-${k}" data-input="finToolQ" data-k="${k}" value="${esc(t.q || "")}" placeholder="Quando eu uso: ..." maxlength="100"></div>`).join("") : `<p style="color:var(--on-hero-2)">A caixa está vazia. Guarde aqui o que te ajuda.</p>`}</div>`; },
  () => `<h2>Mural de objetivos</h2><p class="hand">Até três coisas que eu gostaria de cuidar daqui pra frente.</p><div class="note small">${icon("heart", 18)}<span>Não é obrigação. Pode deixar um, dois ou nenhum, e objetivos podem mudar com o tempo.</span></div>
    <div class="postits">${F().goals.map((g, k) => `<div class="postit"><label class="label" for="fg-${k}">Objetivo ${k + 1}</label><textarea id="fg-${k}" rows="3" data-input="finG" data-k="${k}" data-f="t" maxlength="140" placeholder="Eu quero...">${esc(g.t)}</textarea><label class="small muted" for="fgp-${k}">Um primeiro passo (opcional)</label><input id="fgp-${k}" data-input="finG" data-k="${k}" data-f="passo" value="${esc(g.passo)}" maxlength="100" placeholder="ex.: falar com..."></div>`).join("")}</div>`,
  () => { const c = F().carta; return `<h2>Carta para o meu eu do futuro</h2><div class="row" style="gap:8px"><label for="fl-para" class="hand">Para mim, </label><select id="fl-para" class="field" style="width:auto" data-input="finPara">${["daqui a seis meses", "daqui a um ano", "quando eu precisar lembrar"].map((o) => `<option ${c.para === o ? "selected" : ""}>${o}</option>`).join("")}</select></div>
    <label for="fl-txt" class="sr-only">Texto da carta</label><textarea id="fl-txt" class="field hand-in" data-input="finTxt" maxlength="4000" placeholder="Querida eu do futuro, ...">${esc(c.texto)}</textarea>
    <div class="row"><button class="btn btn-pri btn-sm" data-act="finCopy">${icon("copy", 14)} Copiar a carta</button><span class="small muted">${icon("lock", 13)} A carta fica salva automaticamente neste navegador.</span></div>
    <p class="small muted">Para guardar em outro lugar, copie e cole num documento, num e-mail para você mesma ou num caderno de notas. Também dá para imprimir a partir desse documento.</p>`; },
];
VIEWS.caminho = {
  render() {
    if (isLocked("caminho")) return lockedHTML(FINAL);
    const f = F(); f.step = Math.max(0, Math.min(4, f.step || 0)); f.seen = f.seen || {}; f.seen[f.step] = 1; save();
    return `<div class="diary"><header class="stack-sm" style="text-align:center;align-items:center;margin-bottom:8px">${artSVG("book", "", "0 0 100 104").replace("<svg", '<svg style="width:84px;height:84px"')}<span class="label">Capítulo final</span><h1>${FINAL.titulo}</h1><p class="muted prose">Um espaço só seu, sem jogo, sem pontos e sem pressa. Escreva o que quiser, do jeito que quiser.</p></header>
      <nav class="moments" aria-label="Momentos do capítulo">${FIM.momentos.map((m, i) => `<button class="${i === f.step ? "on" : ""} ${f.seen[i] ? "seen" : ""}" data-act="finGo" data-i="${i}" aria-label="Momento ${i + 1}: ${m}" title="${m}">${i + 1}</button>`).join("")}</nav>
      <p class="small muted" style="text-align:center;margin-bottom:12px">Momento ${f.step + 1} de 5 · ${FIM.momentos[f.step]}</p>
      <article class="paper stack" id="paper">${FIN_R[f.step]()}</article>
      <div class="stepnav">${f.step > 0 ? `<button class="btn btn-ghost" data-act="finBy" data-d="-1">${icon("arrowL", 16)} ${FIM.momentos[f.step - 1]}</button>` : `<a class="btn btn-ghost" href="#inicio">${icon("arrowL", 16)} Mapa da jornada</a>`}
      ${f.step < 4 ? `<button class="btn btn-pri" data-act="finBy" data-d="1">${FIM.momentos[f.step + 1]} ${icon("arrowR", 16)}</button>` : `<button class="btn btn-pri" data-act="finEnd">${icon("star", 16)} Fechar o diário</button>`}</div></div>`;
  },
};
const finRefresh = () => { const y = window.scrollY; $("#paper").innerHTML = FIN_R[F().step](); window.scrollTo(0, y); };
A.finGo = (el) => { F().step = +el.dataset.i; save(); route(); };
A.finBy = (el) => { F().step += +el.dataset.d; save(); route(); };
A.finEnd = () => { F().done = true; F().at = new Date().toLocaleDateString("pt-BR"); save(); location.hash = "#fim"; };
INPUTS.finQ = (el) => { F().q[el.dataset.k] = el.value; save(); };
INPUTS.finC = (el) => { F().cards[el.dataset.k] = el.value; save(); };
A.finToolAdd = (el) => { F().tools.push({ t: el.dataset.v, q: "" }); save(); finRefresh(); };
FORMS.finTool = () => { const v = $("#ft-in").value.trim(); if (!v) return; F().tools.push({ t: v, q: "" }); save(); finRefresh(); $("#ft-in").focus(); };
A.finToolDel = (el) => { F().tools.splice(+el.dataset.k, 1); save(); finRefresh(); };
INPUTS.finToolQ = (el) => { F().tools[+el.dataset.k].q = el.value; save(); };
INPUTS.finG = (el) => { F().goals[+el.dataset.k][el.dataset.f] = el.value; save(); };
INPUTS.finPara = (el) => { F().carta.para = el.value; save(); };
INPUTS.finTxt = (el) => { F().carta.texto = el.value; save(); };
A.finCopy = () => { const c = F().carta; copyText(`Para mim, ${c.para}\n\n${c.texto}`, $("#fl-txt")); };

VIEWS.fim = {
  render() {
    const f = F(); const cards = FIM.cartoes.filter((c) => (f.cards[c.id] || "").trim()); const goals = f.goals.filter((g) => g.t.trim());
    return `<section class="ending"><svg class="sky" viewBox="0 0 1000 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${sky(40, 7)}</svg>
      <div style="position:relative;display:grid;place-items:center;margin-bottom:12px"><svg viewBox="0 0 120 60" style="width:180px;height:auto" aria-hidden="true"><g transform="translate(2 0) scale(.5)">${ART.mic("f-pri")}</g><g transform="translate(64 6) scale(.5)">${ART.skate("f-acc")}</g></svg></div>
      <h1>Toda jornada deixa descobertas.</h1><p>Você olhou para a sua mente, para as suas atitudes e para as suas emoções com curiosidade. O que você descobriu continua com você, e pode crescer, mudar e ganhar novas páginas.</p>
      <div class="row" style="justify-content:center;margin-top:22px;position:relative"><a class="btn btn-hero" href="#inicio">${icon("map", 16)} Voltar ao mapa</a><a class="btn btn-hero-ghost" href="#caminho">${icon("book", 16)} Reler o meu diário</a></div></section>
      ${cards.length || goals.length ? `<section class="stack" style="margin-top:30px">${cards.length ? `<div class="trio">${cards.map((c) => `<div class="tcardx ${c.cls}"><h3>${c.t}</h3><p style="font-family:var(--f-hand);font-size:1.35rem;line-height:1.25;overflow-wrap:anywhere">${esc(f.cards[c.id])}</p></div>`).join("")}</div>` : ""}
      ${goals.length ? `<div class="postits">${goals.map((g) => `<div class="postit"><span class="label">Objetivo</span><p style="font-family:var(--f-hand);font-size:1.35rem;line-height:1.2;overflow-wrap:anywhere">${esc(g.t)}</p>${g.passo ? `<p class="small">Primeiro passo: ${esc(g.passo)}</p>` : ""}</div>`).join("")}</div>` : ""}</section>` : ""}`;
  },
};

boot();
</script>
</body></html>
